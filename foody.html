<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foody on iPhone 17</title>
<style>
/* Stage: one phone centred on a quiet backdrop, scaled to fit the window */
:root{
  --stage:#E6E7EA; --stage2:#D5D7DC; --ink:#26292E; --muted:#6A6F78;
  --alu:#C9C3D9; --alu-hi:#E4DFF0; --alu-lo:#9C95B0;   /* Lavender by default */
}
@media (prefers-color-scheme: dark){:root{--stage:#16181B;--stage2:#0C0D0F;--ink:#E6E8EB;--muted:#8C929B}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 20%,var(--stage),var(--stage2));color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px 16px;overflow:hidden}
.fit{position:relative;flex:none}
.phone{position:absolute;left:0;top:0;width:426px;height:898px;transform-origin:0 0}
/* aluminium band */
.band{position:absolute;inset:0;border-radius:68px;
  background:linear-gradient(135deg,var(--alu-hi),var(--alu) 30%,var(--alu-lo) 70%,var(--alu));
  box-shadow:0 40px 80px rgba(0,0,0,.28),0 10px 24px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.35)}
/* black glass border */
.glass{position:absolute;inset:4px;border-radius:64px;background:#050505}
.screen{position:absolute;left:12px;top:12px;width:402px;height:874px;border-radius:56px;overflow:hidden;background:#000;isolation:isolate;clip-path:inset(0 round 56px);transform:translateZ(0)}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000;border-radius:56px}
/* side buttons */
.btn{position:absolute;width:5px;border-radius:2px;background:linear-gradient(90deg,var(--alu-lo),var(--alu-hi),var(--alu))}
.btn.l{left:-3px}.btn.r{right:-3px}
.action{top:176px;height:34px}.volup{top:236px;height:64px}.voldn{top:314px;height:64px}
.power{top:262px;height:100px}
.cam{right:-1px!important;width:3px!important;top:560px;height:66px;background:linear-gradient(90deg,#2b2b30,#5a5a62)!important}
/* status bar, island, home bar sit on top of the app */
.sb{position:absolute;left:0;right:0;top:0;height:54px;z-index:5;pointer-events:none;display:flex;align-items:center;justify-content:space-between;
  padding:6px 34px 0 52px;color:var(--sbc,#000);font-weight:600;font-size:17px;letter-spacing:-.01em;transition:color .25s}
.sb .ic{display:flex;align-items:center;gap:6px}
.sb svg{display:block;fill:currentColor}
.island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000;z-index:6;pointer-events:none}
.island::after{content:"";position:absolute;right:20px;top:12px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#1d2a44,#06080d 70%)}
.home{position:absolute;left:50%;bottom:8px;width:140px;height:5px;margin-left:-70px;border-radius:3px;z-index:5;pointer-events:none;background:var(--sbc,#000);transition:background .25s}
/* caption */
.under{display:flex;flex-direction:column;align-items:center;gap:10px}
.cap{font-size:13px;color:var(--muted);margin:0;text-align:center}
.cap b{color:var(--ink);font-weight:600}
</style>
</head>

<script>
/* load the app into the screen */
const b64=document.getElementById("payload").textContent.trim();
const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
document.getElementById("app").srcdoc=new TextDecoder("utf-8").decode(bytes);

/* scale the 426×898 phone to fit the window */
const W=426,H=898,phone=document.getElementById("phone"),fit=document.getElementById("fit");
function size(){
  const s=Math.min(1,(innerHeight-90)/H,(innerWidth-32)/W);
  phone.style.transform=`scale(${s})`;fit.style.width=W*s+"px";fit.style.height=H*s+"px";
}
addEventListener("resize",size);size();

/* status bar clock: New York time, like the app */
function clock(){document.getElementById("clock").textContent=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"2-digit",hour12:false}).format(new Date()).replace(/^0/,"")}
clock();setInterval(clock,15000);

/* status bar + home bar turn light or dark depending on what's under them */
function lum(c){const m=c.match(/[\d.]+/g);if(!m)return 1;const [r,g,b]=m.map(Number);return (0.299*r+0.587*g+0.114*b)/255}
addEventListener("message",e=>{
  if(!e.data||!e.data.__frame)return;
  const root=document.querySelector(".screen");
  root.style.setProperty("--sbc",lum(e.data.top)<.55?"#fff":"#000");
  document.getElementById("sb").style.setProperty("--sbc",lum(e.data.top)<.55?"#fff":"#000");
  document.querySelector(".home").style.setProperty("--sbc",lum(e.data.bottom)<.55?"#fff":"#000");
});

</script>
</body>
</html>
