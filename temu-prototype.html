<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honest Coupon Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a working phone on the left, a flow map + design notes rail on the right; stacks on phones. */
:root{
  --bg:#EEEDEA; --fg:#1D1C1A; --muted:#6A6862; --line:#D6D4CE; --panel:#FFFFFF;
  --accent:#E8601C;
  /* phone UI stays a light shopping app in both themes */
  --p-bg:#F6F5F2; --p-card:#FFFFFF; --p-fg:#1D1C1A; --p-muted:#6F6C66; --p-line:#E6E3DD;
  --p-accent:#F06414; --p-accent-dk:#D9480F; --p-accent-soft:#FFE6D6; --p-peach:#FFD9C4; --p-red:#E5281B; --p-maroon:#6B0F0A;
  --p-ok:#2F7A55; --p-ok-soft:#E3F1EA; --p-warn:#9A5B00; --p-warn-soft:#FFF3D9;
  --f-ui:"Figtree","Noto Sans SC",system-ui,sans-serif; --f-note:"Noto Sans SC","Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B1A18;--fg:#EDEBE6;--muted:#A19E96;--line:#3A3833;--panel:#24231F;--accent:#F27B3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1A18;--fg:#EDEBE6;--muted:#A19E96;--line:#3A3833;--panel:#24231F;--accent:#F27B3A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-note);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-inline:20px;display:flex;gap:40px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- phone ---------- */
.phone{width:390px;max-width:100%;height:812px;max-height:calc(100vh - 40px);min-height:640px;border-radius:44px;background:#111;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);flex-shrink:0}
.screen{position:relative;height:100%;border-radius:34px;overflow:hidden;background:var(--p-bg);color:var(--p-fg);font-family:var(--f-ui);font-size:14px;display:flex;flex-direction:column}
.status{height:40px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;background:var(--p-card)}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--p-card);border-bottom:1px solid var(--p-line);flex-shrink:0}
.topbar h1{font-size:16px;margin:0;flex:1;font-weight:700}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--p-line);background:var(--p-card);display:grid;place-items:center;font-size:16px;color:var(--p-fg);flex-shrink:0}
.body{flex:1;overflow-y:auto;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;position:relative}
.card{background:var(--p-card);border-radius:14px;padding:14px;border:1px solid var(--p-line)}
.foot{flex-shrink:0;background:var(--p-card);border-top:1px solid var(--p-line);padding:12px 16px 18px;display:flex;flex-direction:column;gap:8px}
.btn{border:none;border-radius:999px;padding:13px 16px;font-weight:700;font-size:15px;width:100%}
.btn.pri{background:var(--p-accent);color:#fff}
.btn.sec{background:var(--p-card);color:var(--p-fg);border:1.5px solid var(--p-fg)}
.btn.ghost{background:none;color:var(--p-muted);font-weight:600;padding:6px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--p-muted)}.small{font-size:12.5px}.b{font-weight:700}
.price{font-variant-numeric:tabular-nums}
.ph-img{display:block;width:100%;object-fit:cover;background:#E9E6E0}
.thumb{width:58px;height:58px;border-radius:10px;flex-shrink:0;object-fit:cover;background:#E9E6E0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--p-ok-soft);color:var(--p-ok)}.pill.ac{background:var(--p-accent-soft);color:var(--p-accent-dk)}.pill.wa{background:var(--p-warn-soft);color:var(--p-warn)}
.stepper{display:flex;gap:6px;padding:0 16px 10px;background:var(--p-card)}
.stepper i{flex:1;height:4px;border-radius:4px;background:var(--p-line)}.stepper i.on{background:var(--p-accent)}
.steplabel{font-size:12px;color:var(--p-muted);font-weight:600}
.item{display:flex;gap:12px;align-items:center}
.item .meta{flex:1;min-width:0}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:7px;background:var(--p-line);overflow:hidden}.bar b{display:block;height:100%;background:var(--p-accent);transition:width .3s}
.bar.done b{background:var(--p-ok)}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gift{border:1.5px solid var(--p-line);border-radius:12px;padding:10px 6px;background:var(--p-card);text-align:center;font-size:12px;color:var(--p-fg)}
.gift .sw-c{width:100%;height:36px;border-radius:8px;margin-bottom:6px}
.gift.on{border-color:var(--p-accent);box-shadow:0 0 0 2px var(--p-accent-soft)}
.gift:disabled{opacity:.45;cursor:not-allowed}
.line{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}
.line.total{border-top:1px solid var(--p-line);margin-top:6px;padding-top:10px;font-weight:800;font-size:17px}
.radio{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--p-line);border-radius:12px;background:var(--p-card);width:100%;color:var(--p-fg);text-align:left}
.radio .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--p-muted);flex-shrink:0}
.radio.on{border-color:var(--p-fg)}.radio.on .dot{border:5px solid var(--p-fg)}
.toggle{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:none;text-align:left;color:var(--p-fg);padding:0}
.sw{width:42px;height:24px;border-radius:24px;background:var(--p-line);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--p-ok)}.sw.on::after{left:21px}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.banner.wa{background:var(--p-warn-soft);color:var(--p-warn)}.banner.ok{background:var(--p-ok-soft);color:var(--p-ok)}.banner.ne{background:var(--p-line);color:var(--p-fg)}
ul.rules{margin:0;padding-left:18px;line-height:1.6;font-size:14px}

/* product page */
.pp-hero{position:relative;margin:-14px -16px 0}
.pp-hero img{height:300px}
.pp-count{position:absolute;right:12px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.specs dt{color:var(--p-muted)}.specs dd{margin:0}
.coupon-note{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--p-accent);background:var(--p-accent-soft);border-radius:12px;padding:10px 12px;color:var(--p-fg);width:100%;text-align:left}

/* coupon popup (your style) */
.scrim{position:absolute;inset:0;background:rgba(20,18,15,.38);display:flex;align-items:flex-end;z-index:10;animation:fade .2s}
.cpn-sheet{width:100%;border-radius:22px 22px 0 0;background:linear-gradient(180deg,var(--p-peach) 0%,#FFF1E8 45%,#FFFFFF 75%);padding:10px 16px 20px;text-align:center;animation:up .28s;position:relative}
.grab{width:72px;height:5px;border-radius:5px;background:rgba(0,0,0,.18);margin:0 auto 12px}
.cpn-art{display:flex;justify-content:center;margin:2px 0 4px}
.cpn-title{font-size:30px;font-weight:600;color:var(--p-accent);letter-spacing:-.01em;margin:6px 0 8px}
.cpn-chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--p-accent);color:var(--p-accent-dk);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;background:#fff}
.ticket{position:relative;display:flex;align-items:center;gap:12px;margin:16px 0 6px;padding:16px 14px 14px;border-radius:14px;background:var(--p-peach);border:2px dashed #F7B08A;width:100%;color:var(--p-maroon);text-align:left}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#FFF5EE;transform:translateY(-50%)}
.ticket::before{left:-10px}.ticket::after{right:-10px}
.t-radio{width:28px;height:28px;border-radius:50%;background:#fff;flex-shrink:0;display:grid;place-items:center;border:1.5px solid #F2C2A6}
.t-radio.on{background:var(--p-accent);border-color:var(--p-accent);color:#fff;font-weight:800;font-size:15px}
.t-tag{position:absolute;top:-11px;left:58px;background:var(--p-red);color:#fff;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:6px 6px 6px 0}
.t-amt{flex:1;font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1;border-left:2px dashed #F2B591;padding-left:14px}
.t-star{width:70px;height:46px;border-radius:8px;background:var(--p-red);display:grid;place-items:center;flex-shrink:0}
.cpn-fine{font-size:12.5px;color:var(--p-muted);margin:4px 0 12px}
.cpn-actions{display:flex;flex-direction:column;gap:8px}
.cpn-actions .btn{font-size:18px;font-weight:600;padding:14px}

/* step 1: rules + feed */
.rules-card{background:var(--p-card);border:1px solid var(--p-line);border-radius:14px;padding:14px}
.mini{position:sticky;top:-14px;z-index:5;margin:-14px -16px 0;padding:10px 16px;background:var(--p-card);border-bottom:1px solid var(--p-line);display:flex;align-items:center;gap:10px;transition:transform .2s,opacity .2s;width:auto}
.mini[data-hidden="1"]{transform:translateY(-100%);opacity:0;pointer-events:none;height:0;padding:0;border:0;overflow:hidden}
.mini button{all:unset;cursor:pointer;flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;background:var(--p-card);border-radius:12px;border:2px solid transparent;box-shadow:0 0 0 1px var(--p-line);overflow:hidden;display:flex;flex-direction:column;text-align:left;color:var(--p-fg);padding:0}
.pcard.sel{border-color:var(--p-accent);box-shadow:0 0 0 3px var(--p-accent-soft)}
.pcard .pick{all:unset;cursor:pointer;display:block}
.pcard img{height:150px}
.pcard .info{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px}
.pcard .nm{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.pcard .pr{font-weight:800;font-size:15px}
.pcard .rt{font-size:11.5px;color:var(--p-muted)}
.check{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);border:1.5px solid var(--p-line);display:grid;place-items:center;font-weight:800;font-size:14px;color:transparent}
.pcard.sel .check{background:var(--p-accent);border-color:var(--p-accent);color:#fff}
.dbtn{border:1px solid var(--p-line);background:var(--p-bg);color:var(--p-fg);border-radius:999px;font-size:12px;font-weight:600;padding:5px 10px;margin-top:4px;align-self:flex-start}
.loading{grid-column:1/-1;text-align:center;color:var(--p-muted);font-size:12.5px;padding:10px}
.reached{grid-column:1/-1}
.runfoot .bar{margin:6px 0 2px}

/* overlays */
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:var(--p-fg);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;white-space:nowrap;animation:fade .2s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- rail ---------- */
.rail{flex:1;min-width:0;max-width:560px;display:flex;flex-direction:column;gap:22px}
.rail h2{font-family:var(--f-ui);font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
.rail .lead{color:var(--muted);margin:6px 0 0;line-height:1.6;font-size:14.5px}
.eyebrow{font-family:var(--f-ui);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.flow{display:flex;flex-direction:column;gap:6px}
.fnode{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--fg);text-align:left;width:100%}
.fnode .k{font-family:var(--f-ui);font-size:11px;font-weight:700;color:var(--muted);width:56px;flex-shrink:0}
.fnode .t{flex:1;font-size:14px}
.fnode.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.fnode.cur .k{color:var(--accent)}
.fnode.branch{margin-left:28px;width:calc(100% - 28px)}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.notes h3{margin:0 0 4px;font-size:17px}
.notes ol{margin:10px 0 0;padding-left:20px;line-height:1.7;font-size:14px}
.notes .why{color:var(--muted);font-size:13.5px;margin-top:10px;line-height:1.6}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cbtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13px}
.state{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:860px){.phone{height:760px;max-height:none}.rail{max-width:100%}}
@media (max-width:430px){.phone{border-radius:0;padding:0;background:none;box-shadow:none;height:720px}.screen{border-radius:18px;border:1px solid var(--line)}}
/* embed mode: just the phone, used as the scroll-synced sidebar on temu.html */
.embed body{background:transparent}
.embed .wrap{display:block;padding:0}
.embed .rail{display:none}
.embed .phone{width:100%;height:100vh;max-height:none;min-height:0;border-radius:40px;padding:10px;background:#111;box-shadow:none}
.embed .screen{border-radius:31px;border:0}
</style>
<script>if(new URLSearchParams(location.search).has("embed")){document.documentElement.classList.add("embed");document.documentElement.dataset.theme="light"}</script>

<div class="wrap">
  <div class="phone"><div class="screen" id="screen" aria-live="polite"></div></div>
  <aside class="rail">
    <div>
      <div class="eyebrow">Temu coupon pop-up · Ethical prototype</div>
      <h2>Same entrance, honest flow</h2>
      <p class="lead">The phone on the left is fully clickable: add to cart → coupon pops up (once) → read the rules and pick items → review → place order. You can exit from every screen. Use the flow map on the right to jump to any screen.</p>
    </div>
    <div class="ctrls">
      <button class="cbtn" id="reset">Start over</button>
      <button class="cbtn" id="fill">Fill to $100</button>
      <span class="state" id="state"></span>
    </div>
    <div class="flow" id="flow"></div>
    <div class="notes" id="notes"></div>
  </aside>
</div>

function totals(){
  const sub = CONFIG.myItem.price + (S.inEvent ? selList().reduce((t,a)=>t+a.price,0) : 0);
  const qualifies = S.inEvent && sub >= CONFIG.threshold - 1e-9;
  const disc = qualifies ? CONFIG.discount : 0;
  const tax = Math.round((sub - disc) * CONFIG.taxRate * 100) / 100;
  return { sub, disc, tax, total: Math.round((sub - disc + tax) * 100) / 100, qualifies, short: Math.max(0, CONFIG.threshold - sub) };
}
function dateRange([a,b]){ const d=new Date(); const f=x=>{const t=new Date(d);t.setDate(d.getDate()+x);return t.toLocaleDateString("en-US",{month:"short",day:"numeric"})}; return f(a)+" – "+f(b); }
function go(screen, extra={}){ Object.assign(S, extra, { screen, overlay:null }); render(); }
let toastTimer;
function toast(msg){ clearTimeout(toastTimer); document.querySelectorAll(".toast").forEach(t=>t.remove()); const el=document.createElement("div"); el.className="toast"; el.textContent=msg; $("#screen").appendChild(el); toastTimer=setTimeout(()=>el.remove(),1800); }

  const fn = ACT[el.dataset.act]; if(fn){ e.preventDefault(); fn(el); }
});

/* feed: collapse rules into one line + endless loading */
function wireFeed(){
  const sc=$("#feedScroll"); if(!sc) return;
  sc.scrollTop = S.feedScroll;
  const card=$("#rulesCard"), mini=$("#mini");
  const onScroll=()=>{
    S.feedScroll=sc.scrollTop;
    mini.dataset.hidden = sc.scrollTop > card.offsetHeight - 10 ? "0" : "1";
    if (sc.scrollTop + sc.clientHeight > sc.scrollHeight - 220 && S.feedCount < ALL.length && !sc._loading){
      sc._loading=true;
      setTimeout(()=>{ S.feedCount=Math.min(ALL.length,S.feedCount+CONFIG.feedBatch); const keep=sc.scrollTop; render(); const n=$("#feedScroll"); if(n) n.scrollTop=keep; },450);
    }
  };
  sc.addEventListener("scroll", onScroll, {passive:true}); onScroll();
}

const NOTES = {
  product:{ h:"Product page: let the user buy what they came for", pts:["The offer is just an optional note; tapping it opens the coupon","After \u201cAdd to cart\u201d, the coupon pops up once, 0.7s later","\u201cBuy now\u201d goes straight to checkout, skipping any event screens","Item info, options and About this item are readable on the first screen"], why:"Redesign 1: Item first. The original flow used a $20 pop-up here to pull people into the prize wheel." },
  popup:{ h:"Coupon pop-up: original visual style", pts:["Bottom sheet, peach gradient, dashed ticket, red \u201cSpend $100\u201d tag and star tile are kept","The ticket's radio is unselected by default; it's selected only by tapping the ticket or Claim (no preselection)","\u201cLimited Time Offer\u201d becomes \u201cNo time limit · optional\u201d","\u201cNo Thanks\u201d becomes an outlined button the same size as Claim","\u00d7, tapping outside, or Esc closes it, and it won't show again this session"], why:"The last three follow the case study's principles: no countdown, equal weight for both choices. Set CONFIG.equalButtons = true to make both buttons identical." },
  pick:{ h:"Step 1 · Rules + pick items (one screen)", pts:["Rules shown in full at the top, same text size; check-in is off by default","On scroll, rules collapse to one line \u201cSpend $100 in one order\u201d; tap it to expand","Items are a two-column infinite feed; tap a card to select (orange border + check)","Every card has a Details button","Pinned footer: total so far (incl. tax) + how far from $100 + Continue / Just my item"], why:"The old Step 1 (rules) and Step 2 (add items) merge into one, so the flow goes from 3 steps to 2." },
  detail:{ h:"Item details", pts:["Real price, rating, reviews, delivery time and return policy","One button at the bottom: select / deselect, then back to the same spot in the feed"], why:"Replaces the original grid tiles that only showed \u201c$0\u201d and couldn't be opened." },
  review:{ h:"Step 2 · Review", pts:["Split into: what you pay / gift / what you get / what's not included","The gift unlocks only at $100 and shows its real value","If you're short of $100, it clearly says the offer wasn't applied","No preselected payment method (the original defaulted to Venmo)"], why:"In the original flow, $151.34 first appears at Fig. 17." },
  done:{ h:"Confirmation: no \u201creward expired\u201d", pts:["Lists the delivery date for every item and gift","A single \u201cKeep shopping\u201d button","If you joined check-in, it tells you where to opt out"], why:"From my own experience: receiving things I didn't remember buying, and that were hard to return." },
  checkout:{ h:"Branch: buy just my item", pts:["Tapping \u00d7 at any step lands here, with no retention pop-up","One neutral line of copy; the cart is kept","The offer stays available as step 2 of checkout if you want to come back"], why:"Replaces Fig. 19\u201321 in the original flow: \u201creward expired\u201d and \u201cSure to give up?\u201d." },
};
function currentId(){ return S.overlay==="popup" ? "popup" : S.screen; }
function renderRail(){
  const cur=currentId();
  $("#flow").innerHTML = FLOW.map(f=>`<button class="fnode ${f.id===cur?"cur":""} ${f.branch?"branch":""}" data-jump="${f.id}"><span class="k">${f.k}</span><span class="t">${f.t}</span></button>`).join("");
  const n=NOTES[cur];
  $("#notes").innerHTML = `<h3>${n.h}</h3><ol>${n.pts.map(p=>`<li>${p}</li>`).join("")}</ol><div class="why">${n.why}</div>`;
  const t=totals();
  $("#state").textContent = `Current order ${money(t.total)} · ${S.inEvent?`joined offer · ${selList().length} items picked`:"not in offer"}`;
}
function jump(id){
  const base={cartAdded:true,popupSeen:true};
  const pre={ product:{cartAdded:false,popupSeen:false}, popup:{overlay:"popup",screen:"product"}, pick:{inEvent:true,ticket:true}, detail:{inEvent:true,detail:ALL[0].id},
    review:{inEvent:true,sel:{[ALL[0].id]:true},gift:"scale"}, done:{inEvent:true,sel:{[ALL[0].id]:true},gift:"scale",pay:"Apple Pay",orderedFrom:"event"}, checkout:{leftEvent:true} };
  S=Object.assign(fresh(),base,{screen:id==="popup"?"product":id},pre[id]); render();
}
document.getElementById("flow").addEventListener("click", e=>{ const b=e.target.closest("[data-jump]"); if(b) jump(b.dataset.jump); });
addEventListener("message", e=>{ if(e.origin===location.origin && NOTES[e.data?.jump]) jump(e.data.jump); });
$("#reset").onclick=()=>{ S=fresh(); render(); };
$("#fill").onclick=()=>{ S=Object.assign(fresh(),{cartAdded:true,popupSeen:true,inEvent:true,ticket:true,sel:{[ALL[0].id]:true},screen:"pick"}); render(); };

let shownOverlay=null;
function render(){
  const sc=$("#screen");
  const same = S.overlay && S.overlay===shownOverlay;
  sc.innerHTML = SCREENS[S.screen]() + (S.overlay ? OVERLAYS[S.overlay]() : "");
  if(same) sc.querySelectorAll(".scrim,.cpn-sheet").forEach(el=>el.style.animation="none");
  shownOverlay = S.overlay;
  if(S.screen==="pick") wireFeed();
  renderRail();
}
render();
</script>
