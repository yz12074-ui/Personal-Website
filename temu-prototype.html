<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honest Coupon Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Built from the Figma file "Temu 弹窗重设计 · Case Study" (page: Prototype · Honest Coupon).
   Every screen is laid out at the Figma frame size (390×844) and scaled to fit. */
:root{
  --bg:#EEEDEA; --fg:#1D1C1A; --muted:#6A6862; --line:#D6D4CE; --panel:#FFFFFF; --accent:#E8601C;
  --p-bg:#F6F5F2; --p-fg:#1D1C1A; --p-muted:#6F6C66; --p-line:#E6E3DD; --p-accent:#F06414; --p-accent-dk:#D9480F;
  --p-ok:#2F7A55; --p-ok-soft:#E3F1EA; --p-peach:#FFE6D6;
  --push:cubic-bezier(.22,1,.36,1); --sheet:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1B1A18;--fg:#EDEBE6;--muted:#A19E96;--line:#3A3833;--panel:#24231F;--accent:#F27B3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1A18;--fg:#EDEBE6;--muted:#A19E96;--line:#3A3833;--panel:#24231F;--accent:#F27B3A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:Figtree,system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
img{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 48px;display:flex;gap:40px;align-items:flex-start;justify-content:center;flex-wrap:wrap}

/* device: bezel + scaled 390×844 screen */
.phone{width:fit-content;background:#111;border-radius:48px;padding:10px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);flex-shrink:0}
.vp{position:relative;overflow:hidden;border-radius:38px;background:var(--p-bg)}
#screen{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden;color:var(--p-fg);font-size:14px;line-height:normal}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--p-bg)}

/* shared app chrome */
.hdr{background:#fff;flex-shrink:0}
.sbar{height:40px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px}
.tbar{display:flex;gap:10px;align-items:center;padding:10px 16px;min-height:55px}
.hdr.hl .tbar{border-bottom:1px solid var(--p-line)}
.tbar h1{flex:1;min-width:0;margin:0;font-size:16px;font-weight:700}
.tbar .sub{font-size:12px;font-weight:600;color:var(--p-muted);margin-bottom:2px}
.ib{width:40px;height:40px;border-radius:20px;border:1px solid var(--p-line);background:#fff;display:grid;place-items:center;flex-shrink:0}
.ib img{width:16px;height:16px}
.stepper{display:flex;gap:6px;padding:0 16px 10px}
.stepper i{flex:1;height:4px;border-radius:4px;background:var(--p-line)}.stepper i.on{background:var(--p-accent)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.pad{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.foot{flex-shrink:0;background:#fff;border-top:1px solid var(--p-line);padding:12px 16px 18px;display:flex;flex-direction:column;gap:8px}
.card{background:#fff;border:1px solid var(--p-line);border-radius:14px;padding:14px}
.card .t{font-size:14px;font-weight:700}
.muted{color:var(--p-muted)}
.s125{font-size:12.5px}
.btn{width:100%;border-radius:999px;padding:13px 16px;font-size:15px;font-weight:700;display:flex;justify-content:center;white-space:nowrap}
.btn.pri{background:var(--p-accent);color:#fff}
.btn.sec{background:#fff;border:1.5px solid var(--p-fg);padding:11.5px 16px}
.btn.ghost{padding:6px;font-size:14px;font-weight:600;color:var(--p-muted);text-decoration:underline;text-underline-position:from-font}
.btn[disabled]{opacity:.4;cursor:default}
.line{display:flex;justify-content:space-between;padding:5px 0;white-space:nowrap}
.line.total{border-top:1px solid var(--p-line);padding:10px 0 5px;margin-top:0;font-size:17px;font-weight:800}
.item{display:flex;gap:12px;align-items:center}
.item .th{width:58px;height:58px;border-radius:10px;object-fit:cover;flex-shrink:0}
.item .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .m b{font-size:14px;font-weight:600}
.item .p{font-size:14px;font-weight:700;white-space:nowrap}
.lbl{font-size:12px;font-weight:600;color:var(--p-muted)}
.bul{margin:0;padding:0;list-style:none;font-size:13px}
.bul li{line-height:1.65}.bul li::before{content:"•\00a0\00a0"}
.sw{width:42px;height:24px;flex-shrink:0}
.toggle{display:flex;gap:12px;align-items:flex-start;width:100%}
.toggle .tx{flex:1;min-width:0}
.toggle .tx b{display:block;font-size:14px;line-height:1.4}
.toggle .tx span{display:block;font-size:12.5px;line-height:1.4;color:var(--p-muted)}
.toggle .tx span.ok{color:var(--p-ok);font-weight:700}

/* 01 product */
.hero{height:300px;flex-shrink:0;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}
.cnote{display:flex;gap:10px;align-items:center;background:var(--p-peach);border:1.5px dashed var(--p-accent);border-radius:12px;padding:10px 12px;width:100%}
.cnote .star{width:40px;height:29px;object-fit:contain;flex-shrink:0}
.cnote .tx{flex:1;font-size:13px;line-height:1.35}
.spec{display:flex;gap:14px;font-size:13px}.spec span:first-child{width:64px;color:var(--p-muted)}
.gal{position:relative}
.gal .strip{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gal .strip::-webkit-scrollbar{display:none}
.gal .strip img{flex:0 0 100%;scroll-snap-align:start;background:#fff;object-fit:contain}
.gal .strip img:first-child{object-fit:cover}
.gal .cnt{position:absolute;right:12px;bottom:12px;background:rgba(29,28,26,.62);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.rev{display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--p-line)}
.rev:first-of-type{border-top:0;padding-top:0}
.rev .who{display:flex;gap:8px;align-items:baseline;font-size:13px}.rev .who b{font-weight:700}
.rev p{margin:0;font-size:13px;line-height:1.5}
.revpics{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.revpics img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0}

/* 02 coupon sheet */
.ov{position:absolute;inset:0;z-index:10}
.scrim{position:absolute;inset:0;background:rgba(20,18,15,.38)}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 16px 20px;overflow:hidden}
.sheet.cpn{height:552px;background:linear-gradient(180deg,#FFD9C4 0%,#FFF1E8 45%,#fff 75%)}
.grab{width:72px;height:5px;border-radius:5px;background:rgba(0,0,0,.18);flex-shrink:0}
.sheet .x{position:absolute;left:344px;top:12px;width:40px;height:40px;border-radius:20px;border:1px solid var(--p-line);background:rgba(255,255,255,.7);display:grid;place-items:center;z-index:2}
.sheet .x img{width:16px;height:16px}
.cpn .art{width:155px;height:155px;object-fit:cover;flex-shrink:0}
.cpn .ttl{font-size:30px;font-weight:600;letter-spacing:-.3px;color:var(--p-accent);white-space:nowrap}
.chip{background:#fff;border:1.5px solid var(--p-accent);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;color:var(--p-accent-dk)}
.ticket{position:relative;width:100%;display:flex;gap:12px;align-items:center;background:#FFD9C4;border:2px dashed #F7B08A;border-radius:14px;padding:16px 14px 14px;margin-top:6px;transition:border-color .2s}
.ticket.on{border-style:solid;border-color:var(--p-accent)}
.ticket .rd{width:28px;height:28px;flex-shrink:0;border-radius:14px;position:relative}
.ticket .rd img{position:absolute;inset:0;width:28px;height:28px;transition:opacity .2s}
.ticket .rd .ck{inset:6px;width:16px;height:16px}
.ticket .rd .on{opacity:0;background:var(--p-accent);border-radius:14px;position:absolute;inset:0;transition:opacity .2s}
.ticket.on .rd .on{opacity:1}
.ticket .amt{flex:1;border-left:2px dashed #F2B591;padding-left:14px;font-size:34px;font-weight:600;letter-spacing:-.34px;color:#6B0F0A;white-space:nowrap;text-align:left}
.ticket .tstar{width:71px;height:51px;flex-shrink:0}
.ticket .tag{position:absolute;left:70px;top:3px;background:#E5281B;color:#fff;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:6px 6px 6px 0}
.ticket .n{position:absolute;top:32px;width:18px;height:18px}.ticket .n.l{left:-12px}.ticket .n.r{right:-12px}
.cpn .fine{font-size:12.5px;line-height:1.4;color:var(--p-muted);text-align:center}
.cpn .acts{position:relative;width:100%;height:120px;flex-shrink:0}
.cpn .acts .btn{position:absolute;left:0;font-size:18px;font-weight:600;padding:14px;transition:transform .3s var(--push),opacity .3s}
.cpn .acts .a1{top:0}.cpn .acts .a2{bottom:0;padding:12.5px 14px}
.cpn.sel .acts .a1{transform:translateY(33.5px)}
.cpn.sel .acts .a2{transform:translateY(-33.5px) scale(.96);opacity:0;pointer-events:none}
.confetti{position:absolute;left:0;top:124px;width:390px;height:160px;pointer-events:none;opacity:0}

/* 03 pick */
.feedhd{display:flex;justify-content:space-between;align-items:center;white-space:nowrap}
.feed{display:grid;grid-template-columns:174px 174px;gap:10px}
.pc{background:#fff;border:1px solid var(--p-line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s}
.pc.sel{border:2px solid var(--p-accent);box-shadow:0 0 0 3px #FFE5D6}
.pc .pa{position:relative;height:150px;display:block;width:100%}
.pc .pa img.ph{width:100%;height:100%;object-fit:cover}
.pc .ck{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:13px;background:rgba(255,255,255,.9);border:1.5px solid var(--p-line);display:grid;place-items:center;transition:background .2s,border-color .2s,transform .2s}
.pc .ck img{width:14px;height:14px;opacity:0;transition:opacity .2s}
.pc.sel .ck{background:var(--p-accent);border-color:var(--p-accent)}.pc.sel .ck img{opacity:1}
.pc .inf{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.pc .nm{font-size:13px;font-weight:600;line-height:1.3}
.pc .pr{font-size:15px;font-weight:800}
.pc .rt{font-size:11.5px;color:var(--p-muted)}
.dbtn{background:var(--p-bg);border:1px solid var(--p-line);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600}
.bar{height:7px;border-radius:7px;background:var(--p-line);overflow:hidden}.bar b{display:block;height:100%;background:var(--p-accent);border-radius:7px;transition:width .2s,background-color .2s}
.bar.done b{background:var(--p-ok)}
.mini{position:sticky;top:0;z-index:3;margin:-14px -16px 0;padding:8px 16px;background:rgba(246,245,242,.96);border-bottom:1px solid var(--p-line);transition:transform .2s,opacity .2s}
.mini[data-hidden="1"]{transform:translateY(-100%);opacity:0;pointer-events:none;height:0;padding:0;border:0;overflow:hidden}
.mini button{display:flex;align-items:center;gap:8px;width:100%;font-size:13px;font-weight:700}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--p-ok-soft);color:var(--p-ok)}.pill.ac{background:var(--p-peach);color:var(--p-accent-dk)}.pill.wa{background:#FFF3D9;color:#9A5B00}

/* 06 review */
.gifts{display:flex;gap:8px}
.gift{flex:1;min-width:0;background:#fff;border:1.5px solid var(--p-line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;transition:border-color .2s,box-shadow .2s}
.gift.on{border-color:var(--p-accent);box-shadow:0 0 0 2px #FFE5D6}
.gift[disabled]{opacity:.5;cursor:default}
.gift .swf{width:100%;height:56px;border-radius:10px;display:grid;place-items:center}
.gift .swf img{width:44px;height:44px;object-fit:contain}
.gift b{font-size:12px}.gift .d{font-size:11px;line-height:1.25;color:var(--p-muted)}.gift .w{font-size:12px;color:var(--p-muted)}
.radio{display:flex;gap:10px;align-items:center;width:100%;background:#fff;border:1.5px solid var(--p-line);border-radius:12px;padding:11px 12px;font-size:14px}
.radio.on{border-color:var(--p-fg)}
.radio img{width:18px;height:18px}
.banner{border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;background:#FFF3D9;color:#9A5B00}

/* B1 checkout */
.cpcard{display:flex;flex-direction:column;gap:4px;width:100%;padding:14px;border-radius:14px;border:1px solid var(--p-line);background:linear-gradient(180deg,#F06414,#DE282B);color:#fff;text-align:left}
.cpcard .row{display:flex;align-items:center;gap:8px;background:#fff;border-radius:17px;padding:2px 6px 2px 8px}
.cpcard .row span{flex:1;font-size:12px;font-weight:600;color:#E8601C}
.cpcard .row img{width:16px;height:16px}

/* 07 done */
.okc{width:56px;height:56px;border-radius:28px;background:var(--p-ok-soft);display:grid;place-items:center}
.okc img{width:28px;height:28px}

/* C1 / C2 check-in */
.chero{background:linear-gradient(180deg,#FFD9C4,#FFF6F0);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.chero .chip{align-self:flex-start;font-size:12px;padding:3px 10px;border-width:1.2px}
.chero h2{margin:0;font-size:22px;font-weight:800;line-height:1.25}
.stats{display:flex;gap:8px}.stats div{flex:1;background:#fff;border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center}
.stats b{font-size:20px;font-weight:800;color:var(--p-accent-dk)}.stats span{font-size:11.5px;color:var(--p-muted)}
.cal{display:grid;grid-template-columns:repeat(5,60px);gap:7px}
.day{height:56px;border-radius:10px;border:1px solid var(--p-line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;white-space:nowrap}
.day span{font-size:10.5px;font-weight:600;color:var(--p-muted)}
.day i{font-style:normal;font-size:14px;color:var(--p-line)}
.day.cp{background:#FFE6D6;border-color:#F7B08A}.day.cp i{font-size:12.5px;font-weight:800;color:var(--p-accent-dk)}
.day.next{border:2px solid var(--p-accent)}
.day.done{background:var(--p-ok);border-color:var(--p-ok)}.day.done span,.day.done i{color:#fff}.day.done i{font-size:12.5px;font-weight:800}
.day.done img{width:16px;height:16px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--p-muted)}
.legend span{display:flex;gap:5px;align-items:center}.legend i{width:10px;height:10px;border-radius:3px;border:1px solid var(--p-line)}
.today{display:flex;flex-direction:column;align-items:center;gap:6px}
.today .okc{width:52px;height:52px;border-radius:26px}.today .okc img{width:26px;height:26px}
.today b{font-size:20px;font-weight:800}

/* R1 reminder sheet + R2 iOS alert */
.sheet.rem{background:#fff;padding:10px 20px 24px;gap:12px}
.rem .cal-ic{width:64px;height:64px;object-fit:contain}
.rem h3{margin:0;font-size:22px;line-height:28px;font-weight:800;text-align:center}
.rem p{margin:0}
.chips{display:flex;gap:8px;width:100%}
.chips button{flex:1;border:1.5px solid var(--p-line);border-radius:999px;padding:10px 8px;font-size:14px;font-weight:600;text-align:center;background:#fff;transition:background .2s,color .2s}
.chips button.on{background:var(--p-fg);border-color:var(--p-fg);color:#fff}
.npv{background:#F2F1EE;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;width:100%}
.notif{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:12px 14px;font-family:Inter,system-ui,sans-serif;line-height:20px;text-align:left}
.notif img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex-shrink:0}
.notif .tx{flex:1;min-width:0}.notif .r{display:flex;gap:8px}.notif .r b{flex:1;font-size:15px;font-weight:600;color:#000}.notif .r span{font-size:13px;color:rgba(60,60,67,.6)}
.notif p{margin:0;font-size:15px;color:#000}
.ios{position:absolute;left:60px;top:50%;width:270px;transform:translateY(-50%);background:rgba(242,242,242,.96);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:14px;overflow:hidden;font-family:Inter,system-ui,sans-serif;text-align:center;color:#000}
.ios .tx{padding:19px 16px;display:flex;flex-direction:column;gap:4px}
.ios .tx b{font-size:17px;line-height:22px;font-weight:600}.ios .tx span{font-size:13px;line-height:18px}
.ios .bt{display:flex;border-top:.5px solid rgba(60,60,67,.36)}
.ios .bt button{flex:1;height:44px;font-size:17px;color:#007AFF;text-align:center}.ios .bt button+button{border-left:.5px solid rgba(60,60,67,.36);font-weight:600}
.homebar{position:absolute;left:128px;bottom:8px;width:134px;height:5px;border-radius:3px;background:var(--p-fg);z-index:6}
.homezone{position:absolute;left:0;right:0;bottom:0;height:40px;z-index:7;cursor:grab;touch-action:none}

/* R4 home screen */
.home{position:absolute;inset:0;background:linear-gradient(121.6deg,#FFB37A 14.3%,#E8607A 50%,#5B4A9E 85.7%);font-family:Inter,system-ui,sans-serif;color:#fff}
.home .hs{height:50px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:13px}.home .hs span:first-child{font-size:16px}
.home .di{position:absolute;left:133px;top:11px;width:124px;height:36px;border-radius:18px;background:#000}
.apps{position:absolute;left:30px;top:86px;width:330px;display:flex;flex-wrap:wrap;gap:22px 26px}
.app{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:500;width:62px}
.app i{width:62px;height:62px;border-radius:15px;background:rgba(255,255,255,.28)}.app img{width:62px;height:62px;border-radius:15px;object-fit:cover}
.dock{position:absolute;left:12px;top:740px;width:366px;height:92px;border-radius:32px;background:rgba(255,255,255,.24);backdrop-filter:blur(15px);display:flex;gap:24px;padding:15px 21px}
.dock i{width:62px;height:62px;border-radius:15px;background:rgba(255,255,255,.36)}
.home .hb{position:absolute;left:128px;top:834px;width:134px;height:5px;border-radius:3px;background:#fff}
.nbanner{position:absolute;left:8px;top:56px;width:374px;z-index:5;background:rgba(246,246,246,.86);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:12px 14px;transform:translateY(-140%)}
.nbanner .notif{background:none;padding:0}

/* toast (R3) */
.toast{position:absolute;left:50%;top:80px;transform:translateX(-50%);z-index:30;background:var(--p-fg);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;display:flex;gap:8px;white-space:nowrap}
.toast b{color:#7FD3A6;font-weight:800}

/* tap hint: one pulsing dot on the next thing to tap */
.tap{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--p-accent);box-shadow:0 0 0 3px #fff,0 2px 6px rgba(0,0,0,.2);pointer-events:none;z-index:5;transform:translate(-50%,-50%);animation:tapb 1.4s ease-in-out infinite}
.tap::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--p-accent);animation:tapr 1.4s ease-out infinite}
.tap.w{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.45)}.tap.w::after{border-color:#fff}
@keyframes tapb{0%,100%{transform:translate(-50%,-50%) scale(.85)}50%{transform:translate(-50%,-50%) scale(1.1)}}
@keyframes tapr{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* RAIL (standalone page only) */
.rail{flex:1;min-width:0;max-width:560px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.rail h2{margin:4px 0 8px;font-size:28px;line-height:1.15}
.lead{margin:0;color:var(--muted);line-height:1.6;font-size:15px}
.flow{display:flex;flex-direction:column;gap:6px}
.fnode{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--fg)}
.fnode .k{font-size:11px;font-weight:700;color:var(--muted);width:44px;flex-shrink:0}
.fnode .t{font-size:14px;line-height:1.35}
.fnode.cur{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.fnode.branch{margin-left:28px;width:calc(100% - 28px)}
.notes{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.notes h3{margin:0 0 4px;font-size:17px}
.notes ol{margin:10px 0 0;padding-left:20px;line-height:1.7;font-size:14px}
.notes .why{color:var(--muted);font-size:13.5px;margin-top:10px;line-height:1.6}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cbtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13px}

/* embed mode: just the phone, used as the scroll-synced sidebar on temu.html */
.embed body{background:transparent;overflow:hidden}
.embed .wrap{display:block;padding:0}
.embed .rail{display:none}
.embed .phone{box-shadow:none;margin:0 auto}
</style>
<script>if(new URLSearchParams(location.search).has("embed")){document.documentElement.classList.add("embed");document.documentElement.dataset.theme="light"}</script>

<div class="wrap">
  <div class="phone" id="phone"><div class="vp" id="vp"><div id="screen" aria-live="polite"></div></div></div>
  <aside class="rail">
    <div>
      <div class="eyebrow">Temu coupon pop-up · Ethical prototype</div>
      <h2>Same entrance, honest flow</h2>
      <p class="lead">The phone is fully clickable, from the product page through the coupon, checkout, the optional 20-day check-in and its reminder. You can exit from every screen. Use the flow map to jump to any screen.</p>
    </div>
    <div class="ctrls">
      <button class="cbtn" id="reset">Start over</button>
      <button class="cbtn" id="fill">Fill to $100</button>
    </div>
    <div class="flow" id="flow"></div>
    <div class="notes" id="notes"></div>
  </aside>
</div>

<script>
const A = "assets/temu-proto/";
const I = n => A + n;
const CONFIG = {
  threshold: 100, discount: 20, taxRate: 0.08875,
  myItem: {
    id:"bean", name:"Giant Bean Bag Chair, Oversized Shell Shape, Faux Fur", short:"Giant Bean Bag Chair",
    price:51.14, was:88.01, rating:4.5, reviews:645, img:"beanbag.jpg", arrives:[1,6],
    gallery:["beanbag.jpg","photo-white.jpg","photo-room-1.jpg","photo-room-2.jpg","photo-details.jpg","photo-size.jpg"],
    topReviews:[
      {name:"Jhimy Palma", date:"Sep 1, 2026", text:"I love it! It arrived quite quickly, packed in a vacuum-sealed box. It took a couple of hours to expand into shape, and it's quite comfortable. I needed something like this for my reading space to enjoy my fish. I bought the white one; great price and very good quality, definitely worth it! Thank you!"},
      {name:"Mary Famulari", date:"Aug 21, 2026", text:"This chair arrived very quickly and was packaged very well! The material is actually thicker than I expected it to be, which makes it very comfortable to sit on. It's a great product for kids, as well as, adults! I would definitely recommend this product!"},
      {name:"Cruz mari Fernandez", date:"Aug 6, 2026", text:"I loved it! It's super comfortable. I give it a 100/100! I highly recommend it for when guests come over. Thanks for the fast shipping!"},
    ],
    specs:[["Color","Beige"],["Size",'47"W × 43"D × 33"H'],["Material","Faux fur, 100% polyester"],["Fill","High-density foam chunks"]],
    about:["Faux fur cover, soft and warm","Shell-shaped back that supports your whole body","Filled with high-density foam that springs back","Big enough for adults; give it about 48 hours to fully expand after unboxing"],
  },
  catalog: [
    { key:"lounge", name:"Boucle Floor Lounge Chair", price:54.98, rating:4.4, reviews:812, img:"lounge.jpg", arrives:[1,6] },
    { key:"boucle", name:"Teddy Boucle Accent Chair, Wood Legs", price:45.99, rating:4.6, reviews:1290, img:"boucle.jpg", arrives:[2,7] },
    { key:"shelf",  name:"6-Tier Tall Bookshelf, White", price:32.49, rating:4.3, reviews:2034, img:"shelf.jpg", arrives:[2,7] },
    { key:"cat",    name:"Cat Ear Plush Bean Bag, Kids & Pets", price:29.99, rating:4.7, reviews:356, img:"cat.jpg", arrives:[3,8] },
  ],
  variants: [ { name:"", f:"none" }, { name:"Sage", f:"hue-rotate(70deg) saturate(.7)" }, { name:"Sand", f:"sepia(.45) saturate(1.1)" }, { name:"Slate", f:"grayscale(.7) brightness(.92)" } ],
  feedBatch: 6, feedMax: 48,
  gifts: [
    { id:"scale",  name:"Digital Scale", desc:"Kitchen scale, up to 5 kg", worth:6, tint:"rgba(138,151,164,.22)" },
    { id:"pillow", name:"Sleep Pillow",  desc:"Memory foam, travel size",  worth:6, tint:"rgba(180,170,203,.22)" },
    { id:"board",  name:"Cutting Board", desc:"Bamboo, 12 × 8 in",         worth:5, tint:"rgba(179,155,123,.22)" },
  ],
  checkin: { days:20, coupons:{3:1,7:3,14:5,20:8} },
};
const ALL = [];
for (let r=0; ALL.length<CONFIG.feedMax; r++)
  for (const v of CONFIG.variants) for (const c of CONFIG.catalog){
    if (ALL.length>=CONFIG.feedMax) break;
    ALL.push({ id:`${c.key}-${v.name||"base"}-${r}`, name:c.name+(v.name?` · ${v.name}`:""), price:c.price, rating:c.rating, reviews:c.reviews, img:c.img, f:v.f, arrives:c.arrives });
  }
const byId = id => ALL.find(x=>x.id===id);

/* ---------- state ---------- */
const fresh = () => ({ screen:"product", overlay:null, popupSeen:false, inEvent:false, sel:{}, gift:null, pay:null, cartAdded:false,
  ticket:false, detail:null, orderedFrom:null, feedCount:CONFIG.feedBatch, feedScroll:0,
  checkin:false, day:1, reminder:false, remTime:"7:00 pm" });
let S = fresh();
const $ = s => document.querySelector(s);
const money = n => "$" + n.toFixed(2);
const selList = () => Object.keys(S.sel).filter(k=>S.sel[k]).map(byId);
function totals(){
  const sub = CONFIG.myItem.price + (S.inEvent ? selList().reduce((t,a)=>t+a.price,0) : 0);
  const qualifies = S.inEvent && sub >= CONFIG.threshold - 1e-9;
  const disc = qualifies ? CONFIG.discount : 0;
  const tax = Math.round((sub - disc) * CONFIG.taxRate * 100) / 100;
  return { sub, disc, tax, total: Math.round((sub - disc + tax) * 100) / 100, qualifies, short: Math.max(0, CONFIG.threshold - sub) };
}
function dateRange([a,b]){ const d=new Date(); const f=x=>{const t=new Date(d);t.setDate(d.getDate()+x);return t.toLocaleDateString("en-US",{month:"short",day:"numeric"})}; return f(a)+" – "+f(b); }
const pimg = (it, cls) => `<img class="${cls}" src="${I(it.img)}" alt="${it.name}" style="filter:${it.f||"none"}">`;

/* ---------- chrome ---------- */
const sbar = `<div class="sbar"><span>9:41</span><span>●●● 100%</span></div>`;
const ib = (act, icon, label) => `<button class="ib" data-act="${act}" aria-label="${label}"><img src="${I(icon)}" alt=""></button>`;
const hdr = (title, {back="back", right="", line=true}={}) =>
  `<div class="hdr ${line?"hl":""}">${sbar}<div class="tbar">${back?ib(back,"icon-back.svg","Back"):""}<h1>${title}</h1>${right}</div></div>`;
const stepHdr = (n, title) =>
  `<div class="hdr">${sbar}<div class="tbar">${ib("back","icon-back.svg","Back")}<div style="flex:1;min-width:0"><div class="sub">Step ${n} of 2 · Coupon event</div><h1>${title}</h1></div>${ib("exitEvent","icon-close.svg","Exit coupon event")}</div>
   <div class="stepper"><i class="on"></i><i class="${n>1?"on":""}"></i></div></div>`;
const payPicker = () => `<div class="card"><div class="t">Payment method</div><div class="s125 muted">Nothing is pre-selected</div>
  <div style="display:flex;flex-direction:column;gap:8px;padding-top:10px">${["Apple Pay","Visa •••• 3476","PayPal"].map(o=>
  `<button class="radio ${S.pay===o?"on":""}" data-act="pay" data-id="${o}"><img src="${I(S.pay===o?"dot-on.svg":"dot-off.svg")}" alt="">${o}</button>`).join("")}</div></div>`;
const sw = on => `<img class="sw" src="${I(on?"switch-on.svg":"switch-off.svg")}" alt="">`;

/* ---------- screens ---------- */
const SCREENS = {
  product(){
    const m = CONFIG.myItem;
    return `${hdr("Product",{back:"noop",right:ib("cart","icon-cart.svg","Cart")})}
    <div class="body"><div class="hero gal"><div class="strip" id="gal">${m.gallery.map((g,i)=>`<img src="${I(g)}" alt="${m.name}, photo ${i+1}">`).join("")}</div><span class="cnt" id="galCnt">1 / ${m.gallery.length}</span></div>
      <div class="pad" style="padding-bottom:16px">
        <div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:16.5px;font-weight:700;line-height:1.35">${m.name}</div>
          <div style="display:flex;gap:8px;align-items:baseline"><span style="font-size:26px;font-weight:800">${money(m.price)}</span><s class="muted s125">${money(m.was)}</s></div>
          <div class="muted s125">★ ${m.rating} · ${m.reviews} ratings · Free shipping · Arrives ${dateRange(m.arrives)}</div></div>
        <button class="cnote" data-act="openPopup"><img class="star" src="${I("star.png")}" alt=""><span class="tx"><b>Spend $${CONFIG.threshold}, get $${CONFIG.discount} off + 1 gift.</b><br><span class="muted">Optional · you can also add it at checkout</span></span><img src="${I("icon-chev.svg")}" alt="" style="width:16px;height:16px"></button>
        <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="t">Details</div>${m.specs.map(([k,v])=>`<div class="spec"><span>${k}</span><span>${v}</span></div>`).join("")}</div>
        <div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="t">About this item</div><ul class="bul">${m.about.map(a=>`<li style="line-height:1.6">${a}</li>`).join("")}</ul></div>
        <div class="card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="t">Reviews</div><span class="muted s125">★ ${m.rating} · ${m.reviews} ratings</span></div>
          <div class="revpics">${m.gallery.slice(1).map(g=>`<img src="${I(g)}" alt="">`).join("")}</div>
          ${m.topReviews.map(r=>`<div class="rev"><div class="who"><b>${r.name}</b><span class="muted s125">${r.date}</span></div><p>${r.text}</p></div>`).join("")}</div>
        <div class="card muted s125">Free returns within 90 days</div>
      </div></div>
    <div class="foot" style="flex-direction:row;gap:10px"><button class="btn sec" data-act="addToCart">${S.cartAdded?"Added ✓":"Add to cart"}</button><button class="btn pri" data-act="buyNow">Buy now</button></div>`;
  },

  pick(){
    const m=CONFIG.myItem;
    return `${stepHdr(1,"How this coupon works")}
    <div class="body" id="feedScroll"><div class="pad" style="padding-bottom:20px">
      <div class="mini" id="mini" data-hidden="1"><button data-act="expandRules"><span class="pill ac">Rules</span>Spend $${CONFIG.threshold} in one order<span class="muted" style="margin-left:auto">⌄</span></button></div>
      <div class="card" id="rulesCard">
        <ul class="bul" style="font-size:14px"><li style="line-height:1.6"><b>Spend $${CONFIG.threshold}+ in one order</b> → $${CONFIG.discount} off at checkout</li><li style="line-height:1.6"><b>Free gift</b> with that order: pick 1 (worth $5–$6)</li><li style="line-height:1.6">Your giant bean bag chair (${money(m.price)}) already counts</li><li style="line-height:1.6">No time limit. Returns work like any other order.</li></ul>
        <div style="padding:12px 0"><div style="height:1px;background:var(--p-line)"></div></div>
        <button class="toggle" data-act="checkinToggle">${S.checkin
          ? `<span class="tx"><b>Joined the ${CONFIG.checkin.days}-day check-in</b><span class="ok">Day ${S.day} of ${CONFIG.checkin.days} done · tap to manage or leave</span></span>${sw(true)}`
          : `<span class="tx"><b>Also join the ${CONFIG.checkin.days}-day check-in</b><span>Optional and separate. Off by default, leave anytime.</span></span>${sw(false)}`}</button>
      </div>
      <div class="feedhd"><b style="font-size:15px">Pick items for this order</b><span class="muted s125">Tap to select</span></div>
      <div class="feed" id="feed">${ALL.slice(0,S.feedCount).map(card).join("")}</div>
      <div class="muted s125" style="text-align:center" id="loading">${S.feedCount<ALL.length?"Loading more…":"You've seen everything in this event."}</div>
    </div></div>
    <div class="foot" id="pickFoot">${pickFoot()}</div>`;
  },

  detail(){
    const it = byId(S.detail); const on = !!S.sel[it.id];
    return `${hdr("Item details",{back:"closeDetail"})}
    <div class="body"><div class="hero">${pimg(it,"")}</div>
      <div class="pad">
        <div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:16.5px;font-weight:700;line-height:1.35">${it.name}</div>
          <div style="font-size:24px;font-weight:800">${money(it.price)}</div>
          <div class="muted s125">★ ${it.rating} · ${it.reviews} reviews · Arrives ${dateRange(it.arrives)}</div></div>
        <div class="card s125" style="line-height:1.6"><b>Top review</b><br>"Comfortable and sturdy, the color matches the photos." <span class="muted">· verified buyer</span></div>
        <div class="card s125 muted" style="line-height:1.6">Free returns within 90 days · Ships separately from your bean bag</div>
      </div></div>
    <div class="foot"><button class="btn ${on?"sec":"pri"}" data-act="toggleSelDetail" data-id="${it.id}">${on?"Selected ✓ · Remove":"Select for this order"}</button></div>`;
  },

  review(){
    const t = totals(); const items=[CONFIG.myItem,...selList()]; const g = CONFIG.gifts.find(x=>x.id===S.gift);
    return `${stepHdr(2,"Review &amp; pay")}
    <div class="body"><div class="pad" style="padding-bottom:20px">
      ${t.qualifies?"":`<div class="banner">You're ${money(t.short)} short, so the $${CONFIG.discount} coupon isn't applied. Go back to add more, or pay without it.</div>`}
      <div class="card s125"><div class="t">You pay</div>
        ${items.map(i=>`<div class="line"><span style="overflow:hidden;text-overflow:ellipsis;padding-right:8px">${i.short||i.name}</span><span>${money(i.price)}</span></div>`).join("")}
        ${t.disc?`<div class="line" style="color:var(--p-ok)"><span>Coupon</span><span>−${money(t.disc)}</span></div>`:""}
        <div class="line"><span>Sales tax</span><span>${money(t.tax)}</span></div>
        <div class="line total"><span>Total</span><span>${money(t.total)}</span></div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:center"><div class="t">Free gift from Temu (pick 1)</div>${t.qualifies?`<span class="pill ok">Unlocked</span>`:`<span class="pill wa">Unlocks at $${CONFIG.threshold}</span>`}</div>
        <div class="muted s125" style="line-height:1.4">Sent by Temu in your first package. Real items, yours to keep, no points or spins.</div>
        <div class="gifts">${CONFIG.gifts.map(x=>`<button class="gift ${S.gift===x.id?"on":""}" data-act="gift" data-id="${x.id}" ${t.qualifies?"":"disabled"}><span class="swf" style="background:${x.tint}"><img src="${I("gift.png")}" alt=""></span><b>${x.name}</b><span class="d">${x.desc}</span><span class="w">worth $${x.worth}</span></button>`).join("")}</div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;gap:6px"><div class="t">You receive</div><div class="s125" style="line-height:1.7">${items.length} item${items.length>1?"s":""}${g?` + a ${g.name}, free from Temu (worth $${g.worth})`:""}<br>${t.disc?`You save $${t.disc}${g?` + a $${g.worth} gift`:""}`:"No discount on this order"}</div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:6px"><div class="t">Not included</div><div class="s125 muted" style="line-height:1.7">${S.checkin?`${CONFIG.checkin.days}-day check-in coupons arrive later, only if you check in. Nothing extra is charged.`:`No check-in rewards (you didn't join).`}<br>No other rewards. What's above is the whole deal.</div></div>
      ${payPicker()}
    </div></div>
    <div class="foot"><button class="btn pri" data-act="placeEvent" ${S.pay?"":"disabled"}>Place order · ${money(t.total)}</button><button class="btn ghost" data-act="skipToItem">Remove extras, pay ${money(CONFIG.myItem.price)} + tax</button></div>`;
  },

  checkout(){
    const t = totals(); const m = CONFIG.myItem;
    return `${hdr("Checkout",{back:"toProduct"})}
    <div class="body"><div class="pad" style="padding-bottom:20px">
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="lbl">1 · Your item</div>
        <div class="item"><img class="th" src="${I(m.img)}" alt=""><div class="m"><b>${m.short}</b><span class="muted s125">Qty 1 · Arrives ${dateRange(m.arrives)}</span></div><span class="p">${money(m.price)}</span></div></div>
      <button class="cpcard" data-act="openPick"><span class="row"><span>Coupon (optional)</span><img src="${I("icon-chev-orange.svg")}" alt=""></span>
        <b style="font-size:14px">Spend $${CONFIG.threshold}, get $${CONFIG.discount} off + 1 gift</b><span class="s125">You're ${money(Math.max(0,CONFIG.threshold-m.price))} away. Skip it if you only want your item.</span></button>
      <div class="card"><div class="lbl">3 · Pay</div>
        <div class="line"><span>Subtotal</span><span>${money(t.sub)}</span></div><div class="line"><span>Shipping</span><span>Free</span></div>
        <div class="line"><span>Sales tax</span><span>${money(t.tax)}</span></div><div class="line total"><span>Total</span><span>${money(t.total)}</span></div></div>
      ${payPicker()}
    </div></div>
    <div class="foot"><button class="btn pri" data-act="placePlain" ${S.pay?"":"disabled"}>Pay ${money(t.total)} for my item</button>${S.pay?"":`<div class="muted s125" style="text-align:center">Choose a payment method to continue</div>`}</div>`;
  },

  done(){
    const ev = S.orderedFrom==="event";
    const items = ev ? [CONFIG.myItem,...selList()] : [CONFIG.myItem];
    const g = ev ? CONFIG.gifts.find(x=>x.id===S.gift) : null;
    return `${hdr("Order placed",{back:null})}
    <div class="body"><div class="pad">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 4px"><div class="okc"><img src="${I("icon-bigcheck.svg")}" alt=""></div>
        <b style="font-size:20px;font-weight:800">Your items are on the way</b><span class="muted s125">Paid ${money(totals().total)} with ${S.pay}</span></div>
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        ${items.map(i=>`<div class="item">${pimg(i,"th")}<div class="m"><b>${i.short||i.name}</b><span class="muted s125">Arrives ${dateRange(i.arrives)}</span></div><span class="p">${money(i.price)}</span></div>`).join("")}
        ${g?`<div class="item"><span class="th" style="background:${g.tint};display:grid;place-items:center"><img src="${I("gift.png")}" alt="" style="width:58px;height:58px;object-fit:contain"></span><div class="m"><b>${g.name} · free gift</b><span class="muted s125">From Temu · arrives with your first package</span></div><span class="muted" style="font-size:14px">$0.00</span></div>`:""}
      </div>
      ${S.checkin&&ev?`<div class="card s125" style="line-height:1.5">Check-in: day ${S.day} of ${CONFIG.checkin.days}. Manage or leave it anytime in Me › Rewards.</div>`:""}
      <div class="muted s125" style="text-align:center">Every item can be returned within 90 days.</div>
    </div></div>
    <div class="foot"><button class="btn sec" data-act="keepShopping">Keep shopping</button></div>`;
  },

  c1(){
    const cp = CONFIG.checkin.coupons;
    return `${hdr(`${CONFIG.checkin.days}-day check-in`,{back:"checkinBack"})}
    <div class="body"><div class="pad" style="padding-bottom:20px">
      <div class="chero"><span class="chip">Deal</span><h2>Check in once a day,<br>earn small coupons</h2><span class="muted" style="font-size:13px">Takes 2 seconds. Nothing to buy. Leave anytime.</span>
        <div class="stats"><div><b>${CONFIG.checkin.days}</b><span>days</span></div><div><b>${Object.keys(cp).length}</b><span>coupons</span></div><div><b>$${Object.values(cp).reduce((a,b)=>a+b,0)}</b><span>total off</span></div></div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:8px"><div class="t">How it works</div><ul class="bul"><li>Tap Check in once a day, about 2 seconds</li><li>Coupons unlock on <b>day 3, 7, 14 and 20</b></li><li>Missed a day? Progress <b>pauses, it never resets</b></li><li>You never have to buy anything to check in</li></ul></div>
      ${calendar(0, `${CONFIG.checkin.days} days`)}
      <div class="card" style="display:flex;flex-direction:column;gap:6px"><div class="t">The fine print, in plain words</div><div class="muted s125" style="line-height:1.65">Each coupon needs a $30+ order and expires 30 days after you earn it. Coupons only, never cash. No reminders unless you turn them on.</div></div>
    </div></div>
    <div class="foot"><button class="btn pri" data-act="joinCheckin">Join check-in</button><button class="btn ghost" data-act="checkinBack">Not now</button></div>`;
  },

  c2(){
    const d = S.day, n = CONFIG.checkin.days, cp = CONFIG.checkin.coupons;
    const nextDay = +Object.keys(cp).find(k=>+k>d);
    const earned = Object.keys(cp).filter(k=>+k<=d).map(k=>cp[k]);
    const newCp = cp[d];
    return `${hdr(`${n}-day check-in`,{back:"checkinBack"})}
    <div class="body"><div class="pad" style="padding-bottom:20px">
      <div class="card today"><div class="okc"><img src="${I("icon-bigcheck.svg")}" alt=""></div><b>Day ${d} checked in</b>
        <span class="muted" style="font-size:13px">${newCp?`$${newCp} coupon added to your account`:`Come back tomorrow for day ${d+1}`}</span>
        <div style="width:100%;padding-top:6px;display:flex;flex-direction:column;gap:6px"><div class="bar done"><b style="width:${d/n*100}%"></b></div>
          <div class="muted s125" style="text-align:center">${d} of ${n} days · next coupon ($${cp[nextDay]} off) ${d===1?`in ${nextDay-d} days`:`on day ${nextDay}`}</div></div></div>
      ${calendar(d, `${d} / ${n} days`)}

/* ---------- rendering + motion (Figma "Motion system") ---------- */
const screenEl = () => $("#screen");
let page = null, ov = null, busy = false;
function build(){ const p=document.createElement("div"); p.className="page"; p.innerHTML=SCREENS[S.screen](); return p; }
function wireGallery(){ const g=$("#gal"), c=$("#galCnt"); if(!g) return; g.addEventListener("scroll",()=>{ c.textContent=`${Math.round(g.scrollLeft/g.clientWidth)+1} / ${CONFIG.myItem.gallery.length}`; },{passive:true}); }
function afterBuild(){ if(S.screen==="product") wireGallery(); if(S.screen==="pick") wireFeed(); if(S.screen==="c2") wireHome(); if(S.screen==="home") showBanner(); renderRail(); }
// mode: "fwd" push ← 300ms · "back" push → 260ms · "fade" dissolve · "close" app-close · undefined = in place
function render(mode, ms){
  const sc=screenEl(), old=page, next=build();
  if(!old || !mode){ if(old) old.replaceWith(next); else sc.prepend(next); }
  else {
    sc.insertBefore(next, ov && ov.parentNode ? ov : null);
    const dur = ms || (mode==="back"?260:300), ease="cubic-bezier(.22,1,.36,1)";
    if(mode==="fwd"||mode==="back"){
      const dir = mode==="fwd"?1:-1;
      next.animate([{transform:`translateX(${100*dir}%)`},{transform:"none"}],{duration:dur,easing:ease});
      old.animate([{transform:"none"},{transform:`translateX(${-100*dir}%)`}],{duration:dur,easing:ease,fill:"forwards"}).finished.then(()=>old.remove());
    } else if(mode==="close"){
      next.animate([{opacity:0},{opacity:1}],{duration:dur});
      old.style.zIndex=2; old.animate([{transform:"none",borderRadius:"0"},{transform:"scale(.3) translateY(60%)",borderRadius:"40px",opacity:0}],{duration:dur,easing:"cubic-bezier(.32,.72,0,1)",fill:"forwards"}).finished.then(()=>old.remove());
    } else {
      next.animate([{opacity:0},{opacity:1}],{duration:dur,easing:"ease"});
      old.animate([{opacity:1},{opacity:0}],{duration:dur,fill:"forwards"}).finished.then(()=>old.remove());
    }
  }
  page=next; afterBuild();
}
function go(screen, extra={}, mode="fwd", ms){ closeOverlay(true); Object.assign(S, extra, {screen}); render(mode, ms); }
function openOverlay(name){
  S.overlay=name; if(name==="popup") S.popupSeen=true;
  ov && ov.remove();
  ov=document.createElement("div"); ov.className="ov"; ov.innerHTML=OVERLAYS[name](); screenEl().appendChild(ov);
  ov.querySelector(".scrim").animate([{opacity:0},{opacity:1}],{duration:360});
  const box=ov.querySelector(".sheet,.ios");
  if(box.classList.contains("ios")) box.animate([{opacity:0,transform:"translateY(-50%) scale(1.1)"},{opacity:1,transform:"translateY(-50%) scale(1)"}],{duration:300,easing:"cubic-bezier(.32,.72,0,1)"});
  else box.animate([{transform:"translateY(100%)"},{transform:"none"}],{duration:360,easing:"cubic-bezier(.32,.72,0,1)"});
  renderRail();
}
function refreshOverlay(){ if(!ov) return; ov.innerHTML=OVERLAYS[S.overlay](); renderRail(); }
function closeOverlay(instant){
  if(!ov){ S.overlay=null; return Promise.resolve(); }
  const el=ov; ov=null; S.overlay=null;
  if(instant){ el.remove(); return Promise.resolve(); }
  el.querySelector(".scrim").animate([{opacity:1},{opacity:0}],{duration:220,fill:"forwards"});
  const box=el.querySelector(".sheet,.ios");
  const a = box.classList.contains("ios") ? box.animate([{opacity:1},{opacity:0}],{duration:200,fill:"forwards"})
    : box.animate([{transform:"none"},{transform:"translateY(100%)"}],{duration:220,easing:"ease-in",fill:"forwards"});
  renderRail();
  return a.finished.then(()=>el.remove());
}
function toast(html){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el=document.createElement("div"); el.className="toast"; el.innerHTML=html; screenEl().appendChild(el);
  el.animate([{opacity:0,transform:"translate(-50%,-12px)"},{opacity:1,transform:"translate(-50%,0)"}],{duration:300,easing:"cubic-bezier(.22,1,.36,1)"});
  setTimeout(()=>el.animate([{opacity:1},{opacity:0}],{duration:220,fill:"forwards"}).finished.then(()=>el.remove()),2600);
}
function couponBurst(){
  const sheet=ov&&ov.querySelector(".sheet.cpn"); if(!sheet) return;
  const ttl=sheet.querySelector(".ttl"), cf=sheet.querySelector("#confetti");
  // spring (stiffness 320 / damping 16) then 0.6s ease-out settle
  ttl.animate([{transform:"scale(1)"},{transform:"scale(1.15)",offset:.35},{transform:"scale(.97)",offset:.7},{transform:"scale(1)"}],{duration:450,easing:"ease-out"});
  cf.animate([{opacity:0,transform:"scale(.3)"},{opacity:1,transform:"scale(1.05)",offset:.35},{opacity:1,transform:"scale(1) translateY(6px)",offset:.45},{opacity:0,transform:"scale(1) translateY(36px)"}],{duration:1050,easing:"cubic-bezier(.22,1,.36,1)"});
}

function wireFeed(){

function placeHint(){

/* ---------- fit the 390×844 screen into the device ---------- */
function fit(){
  const embed=document.documentElement.classList.contains("embed"), bez=10;
  const availH = embed ? innerHeight-2*bez : Math.min(844, innerHeight-48)-2*bez;
  const availW = embed ? innerWidth-2*bez : Math.min(390, innerWidth-40)-2*bez;
  const k=Math.max(.3,Math.min(availW/390, availH/844));
  screenEl().style.transform=`scale(${k})`;
  const vp=$("#vp"); vp.style.width=390*k+"px"; vp.style.height=844*k+"px"; vp.style.borderRadius=40*k+"px";
  $("#phone").style.borderRadius=(40*k+bez)+"px";
}
addEventListener("resize",fit); fit();

  { id:"review",   k:"06", t:"Step 2 · review & pay" },
  { id:"done",     k:"07", t:"Order placed · delivery dates" },
  { id:"checkout", k:"B1", t:"Exit → buy just my item", branch:true },
  { id:"c1",       k:"C1", t:"20-day check-in · explained first", branch:true },
  { id:"c2",       k:"C2", t:"Day 1 checked in · feedback + a way out", branch:true },
  { id:"r1",       k:"R1", t:"Reminder · the app asks in context", branch:true },
  { id:"r2",       k:"R2", t:"Reminder · iOS permission", branch:true },
  { id:"r3",       k:"R3", t:"Reminder on · toast confirms", branch:true },
  { id:"r4",       k:"R4", t:"7:00 pm · notification slides down", branch:true },
  { id:"r5",       k:"R5", t:"Day 7 · $3 coupon lands", branch:true },
];
const NOTES = {
  product:{ h:"Product page: let the user buy what they came for", pts:["The offer is an optional note; tapping it opens the coupon","After “Add to cart”, the coupon pops up once, 0.7s later","“Buy now” goes straight to checkout, skipping any event screens","Item info, options and About this item are readable on the first screen"], why:"Redesign 1: Item first." },
  popup:{ h:"Coupon pop-up: kept, made honest", pts:["Bottom sheet, peach gradient, dashed ticket, red “Spend $100” tag and star tile","The ticket isn't preselected; the user taps it to choose","“Limited Time Offer” becomes “No time limit · optional”","“No thanks, just my item” is the same size as the main button","×, tapping outside or Esc closes it, and it won't show again"], why:"No countdown, equal weight for both choices." },
  popupSel:{ h:"Coupon selected: two buttons merge into “Save money”", pts:["Tap the ticket: the title pops to “Coupon added!” and confetti bursts from the title, then falls and fades","Two-stage motion: spring (stiffness 320 / damping 16), then a 0.6s ease-out settle","The two buttons converge into a single “Save money”; the sheet keeps its height","Tap the ticket again to unselect; × and the scrim still close it anytime"], why:"Let the user choose first, then offer one next step — no big button pushing them up front." },
  pick:{ h:"Step 1 · Rules + pick items (one screen)", pts:["Rules in full at the top, same text size; check-in is off by default","On scroll, rules collapse to one line you can tap to reopen","Two-column infinite feed; tap a card to select (orange border + check)","Pinned footer: total so far incl. tax, distance to $100, Continue or Skip"], why:"Selecting one item reaches the threshold: the bar turns green — “✓ $100 reached · $20 off applied”." },
  detail:{ h:"Item details", pts:["Real price, rating, reviews, delivery time and return policy","One button: select / deselect, then back to the same spot in the feed"], why:"Replaces grid tiles that only showed “$0” and couldn't be opened." },
  review:{ h:"Step 2 · Review", pts:["Split into: what you pay / free gift / what you get / what's not included","The gift unlocks at $100 and shows what it really is","If you're short of $100, it says the coupon isn't applied","No preselected payment method"], why:"The total is visible before you pay, not revealed at the end." },
  done:{ h:"Confirmation: no “reward expired”", pts:["Every item and the gift, with delivery dates","A single “Keep shopping” button","If you joined check-in, it says where to leave"], why:"From my own experience: receiving things I didn't remember buying, and that were hard to return." },
  checkout:{ h:"Branch: buy just my item", pts:["× / Skip / No thanks on any step lands here, with no retention pop-up","The offer stays as an optional card in checkout"], why:"Replaces “reward expired” and “Sure to give up?”." },
  c1:{ h:"20-day check-in: explain first, then let the user decide", pts:["Opened from the Step 1 toggle, on its own page, never switched on silently","20 days / 4 coupons / $17 total, readable at a glance","Missing a day pauses progress, it never resets","Fine print in plain words: $30 minimum, expires in 30 days, coupons not cash","“Join” and “Not now” are both clear; the default is not joining"], why:"The original hid a pre-checked check-in task inside the event." },
  c2:{ h:"Day 1: feedback, and a way out", pts:["Big check + progress: done for today, and when the next one is","Day 1 turns green, day 2 gets an orange outline","Daily reminder is off by default","“Leave check-in” is one tap, no retention; earned coupons stay","“Back to my order” returns to Step 1 with the toggle on"], why:"No “just X more days for the grand prize” pressure copy." },
  r1:{ h:"Turn the toggle on → the app explains first", pts:["Spells it out: one a day, only during check-in, no ads","The user picks the time (default 7 pm)","A preview of exactly what the notification looks like","“Not now” leaves anytime, before the one-shot iOS prompt is spent"], why:"" },
  r2:{ h:"The native iOS permission alert", pts:["Copy and buttons are fixed by iOS","Allow → reminder on; Don't Allow → nothing changes"], why:"" },
  r3:{ h:"Toggle turns green + a toast confirms", pts:["Subtitle says “Every day at 7:00 pm · turn off anytime”","Swipe up from the bottom edge (or tap the home bar) to go Home"], why:"" },
  r4:{ h:"7:00 pm: the notification slides down", pts:["On the Home Screen, after 0.6s the banner springs down from the top","Copy: “Your $3 coupon is ready” — the benefit is the title","Tap it to open the app and complete day 7"], why:"Notification copy: no bait, no fake urgency, no “$100” teaser for a $3 coupon." },
  r5:{ h:"Day 7 checked in · $3 coupon added", pts:["Days 1–7 turn green; days 3 and 7 show the coupons earned","“Your coupons” lists both, with the conditions"], why:"" },
};
function currentId(){
  if(S.overlay==="popup") return S.ticket?"popupSel":"popup";
  if(S.overlay==="reminder") return "r1"; if(S.overlay==="ios") return "r2";
  if(S.screen==="home") return "r4";
  if(S.screen==="c2") return S.day>=7?"r5":S.reminder?"r3":"c2";
  return S.screen;
}
function renderRail(){
  if(document.documentElement.classList.contains("embed")) return;
  const cur=currentId();
  $("#flow").innerHTML = FLOW.map(f=>`<button class="fnode ${f.id===cur?"cur":""} ${f.branch?"branch":""}" data-jump="${f.id}"><span class="k">${f.k}</span><span class="t">${f.t}</span></button>`).join("");
  const n=NOTES[cur];
  $("#notes").innerHTML = `<h3>${n.h}</h3><ol>${n.pts.map(p=>`<li>${p}</li>`).join("")}</ol>${n.why?`<div class="why">${n.why}</div>`:""}`;
}
function jump(id){
  const sel={[ALL[0].id]:true}, ev={inEvent:true,ticket:true,cartAdded:true,popupSeen:true};
  const P = {
    product:{}, popup:{cartAdded:true}, popupSel:{cartAdded:true,ticket:true},
    pick:ev, detail:{...ev,detail:ALL[0].id}, review:{...ev,sel,gift:"scale"},
    done:{...ev,sel,gift:"scale",pay:"Apple Pay",orderedFrom:"event"}, checkout:{cartAdded:true,popupSeen:true},
    c1:ev, c2:{...ev,checkin:true}, r1:{...ev,checkin:true}, r2:{...ev,checkin:true}, r3:{...ev,checkin:true,reminder:true},
    r4:{...ev,checkin:true,reminder:true}, r5:{...ev,checkin:true,reminder:true,day:7},
  };
  const screen = {popup:"product",popupSel:"product",r1:"c2",r2:"c2",r3:"c2",r4:"home",r5:"c2"}[id] || id;
  closeOverlay(true);
  S=Object.assign(fresh(),P[id],{screen});
  render("fade",240);
  if(id==="popup"||id==="popupSel") openOverlay("popup");
  if(id==="r1") openOverlay("reminder");
  if(id==="r2") openOverlay("ios");
}
document.getElementById("flow").addEventListener("click", e=>{ const b=e.target.closest("[data-jump]"); if(b) jump(b.dataset.jump); });
addEventListener("message", e=>{ if(e.origin===location.origin && NOTES[e.data?.jump] && currentId()!==e.data.jump) jump(e.data.jump); });
addEventListener("message", e=>{ if(e.origin===location.origin && e.data && "hint" in e.data){ S.hint=e.data.hint; placeHint(); } });
$("#reset").onclick=()=>jump("product");
$("#fill").onclick=()=>{ jump("pick"); S.sel={[ALL[0].id]:true}; render(); };

render();
</script>
