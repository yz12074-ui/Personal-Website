<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title data-zh="阿伴 Aban — 张玥妍">Aban — Amanda</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F7F3EE;color:#2C2118;font-family:"DM Sans",sans-serif;padding:16px;box-sizing:border-box}
  html:lang(zh-CN) body{font-family:"DM Sans","PingFang SC","Noto Sans SC",sans-serif}
  main{width:100%;max-width:360px;text-align:center}
  h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:34px;margin:0 0 8px}
  h1 em{color:#C4825A}
  p{color:#8A7B6E;font-size:14px;line-height:1.6;margin:0 0 24px}
  input,button{width:100%;box-sizing:border-box;font:inherit;padding:12px 16px;border-radius:999px;border:1px solid #E2CDB8}
  input{background:#fff;margin-bottom:10px}
  form button{background:#2C2118;color:#F7F3EE;border:0;cursor:pointer}
  .err{color:#B4442A;font-size:13px;min-height:20px;margin-top:10px}
  a{color:#8A7B6E;font-size:13px}
  .lang-toggle{position:fixed;top:20px;right:20px;width:auto;font-size:12px;letter-spacing:.04em;color:#8A7B6E;background:none;padding:4px 12px;cursor:pointer}
  .lang-toggle b{color:#2C2118;font-weight:500}
  .soon{font-family:"Cormorant Garamond",serif;font-size:26px;color:#2C2118;margin:16px 0 28px}
</style>
</head>
<body>
<button class="lang-toggle" type="button"><b>EN</b> / 中文</button>
<main>
  <h1 data-zh="阿伴 · <em>把灵感变成收入</em>">Aban — <em>Turn inspiration into income</em></h1>
  <div id="locked">
    <p data-zh="这个项目需要密码才能查看。">This case study is password protected.</p>
    <form id="f">
      <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus aria-label="Password">
      <button data-zh="查看项目">View case study</button>
      <div class="err" id="err" role="alert"></div>
    </form>
  </div>
  <div id="open" hidden><p class="soon" data-zh="内容准备中。">Coming soon.</p></div>
  <a href="index.html#projects" data-zh="← 返回作品">← Back to projects</a>
</main>
<script>
// TODO(Amanda): set the password. Put the SHA-256 hex of your password here; empty = not set yet.
// Get it in the browser console with:  await sha256('your-password')
// This only stops casual visitors. For real protection use Vercel Password Protection.
const PASSWORD_SHA256 = '';

async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const zh = () => document.documentElement.lang === 'zh-CN';
const unlock = () => { document.getElementById('locked').hidden = true; document.getElementById('open').hidden = false; };
if (sessionStorage.getItem('aban-unlocked') === '1') unlock();
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  if (!PASSWORD_SHA256) { err.textContent = zh() ? '密码还没有设置。' : 'The password has not been set yet.'; return; }
  if (await sha256(document.getElementById('pw').value) === PASSWORD_SHA256) { sessionStorage.setItem('aban-unlocked', '1'); unlock(); }
  else err.textContent = zh() ? '密码不正确。' : 'Wrong password.';
});
</script>
<script src="assets/i18n.js" defer></script>
</body>
</html>
