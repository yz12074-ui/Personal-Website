<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoveLink prototype — Amanda Zhang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ---------- page around the phone ---------- */
:root{--bg:#EEEBF7;--ink:#1D1B19;--dim:#6A655E;--brand:#8177E0;--pink:#FF95C3;--bezel:#1d1a2b;
  --grad:linear-gradient(90deg,#8177E0,#FF95C3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151f;--ink:#EEEAE2;--dim:#A39D93}}
:root[data-theme="dark"]{--bg:#17151f;--ink:#EEEAE2;--dim:#A39D93}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px 16px}
.rail{width:200px;display:flex;flex-direction:column;gap:3px}
.rail h1{font-size:22px;margin:0 0 2px}
.rail p{margin:0 0 12px;font:13px/1.5 "JetBrains Mono",monospace;color:var(--dim)}
.rail span{font:600 11px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--dim);margin:10px 0 2px}
.rail button{all:unset;cursor:pointer;padding:5px 10px;border-radius:8px;font-size:15px}
.rail button:hover{background:rgba(129,119,224,.12)}
.rail button.on{background:var(--brand);color:#fff}
.rail a{margin-top:14px;font:12px "JetBrains Mono",monospace;color:var(--dim)}
.phone{position:relative;flex:none;border:10px solid var(--bezel);background:var(--bezel);border-radius:calc(var(--w) * .14);
  box-shadow:0 30px 70px -20px rgba(60,40,140,.45);overflow:hidden}
.screenbox{position:relative;width:var(--w);height:calc(var(--w) * 852 / 393);overflow:hidden;border-radius:calc(var(--w) * .12)}
.embed body{background:transparent;min-height:0}
.embed .wrap{padding:0;min-height:100vh}
.embed .rail{display:none}
.embed .phone{box-shadow:none}
@media (max-width:640px){.rail{display:none}}

/* ---------- the app, designed at 393×852 and scaled ---------- */
#app{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0;overflow:hidden;
  font-family:"SF Pro Text","PingFang HK",-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#fff;background:#2b2545}
:where(#app) button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:where(#app) input{font:inherit;color:inherit;border:0;outline:0;background:none;min-width:0}
.scr{position:absolute;inset:0;overflow:hidden}
.scr.in{animation:scrIn .38s cubic-bezier(.2,.8,.2,1)}
.scr.in.back{animation-name:scrBack}
.scr.out{animation:scrOut .3s ease forwards;pointer-events:none}
@keyframes scrIn{from{transform:translateX(24%);opacity:0}}
@keyframes scrBack{from{transform:translateX(-24%);opacity:0}}
@keyframes scrOut{to{opacity:0;transform:scale(.97)}}
.dark{background:linear-gradient(180deg,#5a4f8f 0%,#3b3360 38%,#2b2545 70%,#221d36 100%)}
.dark::before,.dark::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.dark::before{width:300px;height:300px;left:-90px;top:140px;background:#ff95c3;opacity:.35}
.dark::after{width:280px;height:280px;right:-100px;top:440px;background:#8177e0;opacity:.5}
.scr>*{position:relative;z-index:1}
.glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:20px}
.grad-btn{background:var(--grad);color:#fff;border-radius:99px;font-weight:600;box-shadow:0 10px 24px rgba(255,149,195,.3)}
.sb{position:absolute;top:0;left:0;right:0;height:50px;padding:16px 30px 0 34px;display:flex;justify-content:space-between;font-weight:600;font-size:16px;z-index:5}
.sb svg{height:12px}
.sb.ink{color:#2b2545}
.top{position:absolute;top:54px;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;text-align:center;z-index:4}
.top b{display:block;font-size:19px;font-weight:600}
.top small{display:block;font-size:11px;opacity:.65}
.round{position:absolute;top:6px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16)!important;display:grid;place-items:center}
.round.l{left:20px}.round.r{right:20px}
.round svg{width:16px;height:16px}
.tab{position:absolute;left:30px;right:30px;bottom:26px;height:58px;border-radius:30px;display:flex;justify-content:space-around;align-items:center;z-index:6;
  background:rgba(40,34,62,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tab button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;opacity:.8;transition:background .2s,opacity .2s}
.tab button.on{background:rgba(255,255,255,.22);opacity:1}
.tab svg{width:22px;height:22px}
.homebar{position:absolute;bottom:8px;left:50%;translate:-50% 0;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.7);z-index:7}
.light .homebar{background:rgba(40,30,70,.35)}
.toast{position:absolute;left:50%;top:70px;translate:-50% -10px;z-index:50;background:rgba(255,255,255,.95);color:#4a3f86;font-size:13px;font-weight:600;
  padding:9px 16px;border-radius:99px;white-space:nowrap;opacity:0;transition:opacity .25s,translate .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.on{opacity:1;translate:-50% 0}
.tap{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--pink);pointer-events:none;z-index:40;
  box-shadow:0 0 0 0 rgba(255,149,195,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(255,149,195,0)}100%{box-shadow:0 0 0 0 rgba(255,149,195,0)}}

/* welcome: three soft blobs that drift together and melt into one */
.welcome{background:#fff;color:#2b2545}
.blobs{position:absolute;left:46px;top:150px;width:300px;height:300px;filter:blur(34px) saturate(1.15);animation:spin 36s linear infinite}
.blobs i{position:absolute;width:170px;height:170px;border-radius:50%;mix-blend-mode:multiply}
.blobs .b1{left:10px;top:0;background:radial-gradient(circle at 40% 40%,#FFE6A6,#FFD8A8 60%,rgba(255,216,168,0) 72%);animation:m1 9s ease-in-out infinite alternate}
.blobs .b2{left:130px;top:40px;background:radial-gradient(circle at 50% 50%,#FFB3D8,#F7A6E0 55%,rgba(247,166,224,0) 72%);animation:m2 11s ease-in-out infinite alternate}
.blobs .b3{left:60px;top:125px;background:radial-gradient(circle at 45% 45%,#7C6BFF,#B98CFF 55%,rgba(185,140,255,0) 74%);animation:m3 10s ease-in-out infinite alternate}
@keyframes m1{0%{transform:translate(-26px,-18px) scale(.9)}100%{transform:translate(46px,58px) scale(1.12)}}
@keyframes m2{0%{transform:translate(34px,-22px) scale(.92)}100%{transform:translate(-50px,40px) scale(1.15)}}
@keyframes m3{0%{transform:translate(0,40px) scale(.95)}100%{transform:translate(8px,-44px) scale(1.18)}}
@keyframes spin{to{rotate:360deg}}
.closer{position:absolute;top:500px;left:0;right:0;text-align:center;font-size:34px;font-weight:500;margin:0;letter-spacing:.3px;
  background:linear-gradient(90deg,#D9A9DE,#8177E0);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:rise 1.4s .6s ease forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.welcome .cta{position:absolute;left:62px;right:62px;top:724px;height:44px;font-size:18px}
.have{position:absolute;top:778px;left:0;right:0;text-align:center;font-size:12px;color:#8a86a0;margin:0}
.have a{color:#E8B400;text-decoration:underline;cursor:pointer;font-weight:600}

/* sign up / sign in (the 2026 "glass sheet" screens) */
.auth{background:linear-gradient(180deg,#8f86dc 0%,#b3a8e0 30%,#cbc2e2 60%,#d3cbe0 100%)}
.auth .halo{position:absolute;border-radius:50%;filter:blur(40px);animation:float 7s ease-in-out infinite alternate}
.auth .h1{width:150px;height:110px;left:120px;top:20px;background:#5f4fd8;opacity:.75}
.auth .h2{width:170px;height:130px;left:40px;top:90px;background:#e7b9e8;opacity:.8;animation-delay:-3s}
@keyframes float{to{transform:translate(24px,12px) scale(1.08)}}
.sheet{position:absolute;left:0;right:0;top:134px;bottom:0;border-radius:28px 28px 0 0;padding:44px 40px 0 44px;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1) 40%,rgba(255,255,255,.06));border-top:1px solid rgba(255,255,255,.7);
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
.sheet h2{margin:0 0 30px;font-weight:500;font-size:32px;line-height:1.2}
.sheet.center h2{text-align:center}
.field{display:flex;align-items:center;height:40px;border-radius:20px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.12);
  padding:0 16px;margin-bottom:14px;transition:background .25s,box-shadow .25s}
.field:focus-within{background:rgba(255,255,255,.26);box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.field input{flex:1;font-size:15px}
.field input::placeholder{color:rgba(255,255,255,.65)}
.sheet .cta{width:100%;height:42px;font-size:18px;margin-top:6px;border-radius:21px;border:1px solid rgba(255,255,255,.7);
  background:linear-gradient(90deg,#a99ee6,#cdbde9);box-shadow:none}
.sheet .cta.load{background:linear-gradient(90deg,#8177e0,#ff95c3)}
.agree{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:11.5px;color:#4a4560;cursor:pointer}
.box{width:16px;height:16px;flex:none;border:1.3px solid #8a86a0;border-radius:3px;background:rgba(255,255,255,.6);display:grid;place-items:center}
.box.on{background:#8177e0;border-color:#8177e0}
.box.on::after{content:"";width:7px;height:4px;border:2px solid #fff;border-top:0;border-right:0;rotate:-45deg;translate:0 -1px}
.err{color:#d8336b;font-size:12px;min-height:16px;margin:6px 0 0}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.social{position:absolute;bottom:58px;left:0;right:0;text-align:center;font-size:12px;color:#5a5570}
.social div{display:flex;justify-content:center;gap:18px;margin-top:10px}
.social i{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(80,60,160,.15)}
.social svg{width:24px;height:24px;fill:#8177e0}
.switch{font-size:12px;color:#4a4560;text-align:center;margin-top:18px}
.switch a{color:#5a4fc8;font-weight:600;text-decoration:underline;cursor:pointer}
.link iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* home dashboard */
.home{background:#1f1a2c}
.home .photo{position:absolute;inset:0;background:url(assets/lovelink-app/food.webp) center/cover;filter:blur(3px) brightness(.62) saturate(.9);transform:scale(1.06);z-index:0}
.card{position:absolute;left:18px;right:18px}
.meet{top:62px;height:150px;padding:14px 16px}
.meet .lbl{display:flex;justify-content:space-between;font-size:12px;opacity:.75;padding:0 8px}
.meet .tiles{display:flex;gap:10px;margin-top:8px}
.tile{height:72px;border-radius:12px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:48px;font-weight:300;
  color:#2d2742;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.tile.d{width:72px}.tile.t{flex:1;font-variant-numeric:tabular-nums;letter-spacing:1px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:#fff}
.todo{top:226px;left:18px;width:170px;height:186px;padding:12px}
.todo h4,.pc h4{margin:0 0 10px;font-size:12.5px;font-weight:500;opacity:.85}
.check{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:12px;cursor:pointer;width:100%;text-align:left}
.check i{width:20px;height:20px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,.7);display:grid;place-items:center}
.check.on i{background:#fff}
.check.on i::after{content:"";width:8px;height:4px;border:2px solid #4a3f86;border-top:0;border-right:0;rotate:-45deg;translate:0 -1px}
.check span{flex:1;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.22)}
.check.on span{text-decoration:line-through;opacity:.7}
.pc{top:226px;right:18px;left:auto;width:172px;height:186px;padding:0;overflow:hidden;cursor:pointer}
.pc img{width:100%;height:104px;object-fit:cover;display:block}
.pc p{margin:6px 10px 4px;font-size:12px}
.pc .reply{margin:0 10px;height:26px;border-radius:8px;background:rgba(255,255,255,.16);display:flex;align-items:center;padding:0 8px;font-size:11px}
.pc .reply input{width:100%}
.pc .reply input::placeholder{color:rgba(255,255,255,.55)}
.voice{top:426px;height:66px;display:flex;align-items:center;justify-content:center;gap:16px;cursor:pointer}
.voice .dots{display:flex;gap:6px}.voice .dots i{width:5px;height:5px;border-radius:50%;background:#fff;animation:wave 1.4s ease-in-out infinite}
.voice .play{width:34px;height:34px}
.voice .unread{position:absolute;right:-4px;top:-4px;width:14px;height:14px;border-radius:50%;background:#ff6b8a;border:2px solid rgba(255,255,255,.6)}
@keyframes wave{50%{transform:translateY(-5px);opacity:.6}}
.status{top:506px;height:176px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;padding:0}
.status>button{display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:2px}
.status>button+button{border-left:1px solid rgba(255,255,255,.18)}
.status b{font-weight:500;font-size:15px}.status small{font-size:10px;opacity:.7}
.status .face{width:84px;height:84px;margin-top:14px;border-radius:50%;background:rgba(255,255,255,.32);display:grid;place-items:center;font-size:40px}
.status .face svg{width:40px;height:40px}

/* clock / calendar / history / album */
.seg{position:absolute;top:112px;left:50%;translate:-50% 0;display:flex;padding:4px;border-radius:99px;background:rgba(255,255,255,.14)}
.seg button{padding:7px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:.75}
.seg button.on{background:#fff;color:#4a3f86;opacity:1}
.dial{position:absolute;top:168px;left:50%;translate:-50% 0;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c3b8ff,#8177e0 60%,#6a5fd0);box-shadow:0 20px 50px rgba(30,20,80,.5),inset 0 0 0 10px rgba(255,255,255,.12)}
.dial.lon{background:radial-gradient(circle at 35% 30%,#ffe2a8,#ffb08a 55%,#ff8fb0)}
.dial i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:3px;background:#fff;transition:rotate .6s cubic-bezier(.3,1.4,.5,1)}
.dial .hh{width:6px;height:62px;margin-left:-3px}.dial .mm{width:4px;height:88px;margin-left:-2px}.dial .ss{width:2px;height:96px;margin-left:-1px;background:#ffd0e2;transition:none}
.dial::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#fff}
.digital{position:absolute;top:412px;left:0;right:0;text-align:center;font-size:40px;font-weight:300;font-variant-numeric:tabular-nums}
.digital small{display:block;font-size:13px;opacity:.7;font-weight:400}
.row{position:absolute;left:18px;right:18px;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-size:13px}
.flight{top:530px}.flight b{font-size:15px}.flight .line{flex:1;margin:0 10px;border-top:1.5px dashed rgba(255,255,255,.6);position:relative}
.flight .line::after{content:"✈";position:absolute;left:50%;top:-11px;translate:-50% 0;font-size:14px}
.weather{top:604px}
.daysleft{top:672px;justify-content:center;gap:10px;font-size:15px}
.daysleft b{font-size:30px;font-weight:300}
.cal-date{position:absolute;top:108px;left:22px;font-size:15px;opacity:.75}
.cal-date b{display:block;font-size:28px;font-weight:600;opacity:1;color:#fff}
.plan{position:absolute;top:184px;left:18px;right:18px;height:42px;display:flex;align-items:center;padding:0 16px;border-radius:21px}
.plan input::placeholder{color:rgba(255,255,255,.6)}
.chips{position:absolute;top:238px;left:18px;right:18px;display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.18)}
.chip.p{background:#ff8fb0}.chip.y{background:#f3c64e;color:#4a3a10}.chip.v{background:#8177e0}
.cols{position:absolute;top:318px;left:18px;right:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cols .glass{padding:12px}
.cols h4{margin:0 0 10px;font-size:12.5px;font-weight:500;opacity:.85}
.count{position:absolute;left:18px;right:18px;display:flex;align-items:center;gap:6px;padding:12px 14px;font-size:13px}
.count .fd{width:34px;height:46px;border-radius:8px;background:rgba(255,255,255,.85);color:#4a3f86;display:grid;place-items:center;font-size:28px;font-weight:300}
.count span{margin-left:8px;opacity:.85}
.who{position:absolute;top:104px;left:0;right:0;text-align:center}
.who img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.7)}
.who p{margin:4px 0 0;font-size:12px;opacity:.75}
.cloud{position:absolute;top:196px;left:18px;right:18px;height:150px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 12px;padding:14px;text-align:center}
.cloud span{line-height:1.1}
.hist{position:absolute;top:362px;left:18px;right:18px;bottom:30px;overflow:auto;scrollbar-width:none}
.hist h4{margin:0 0 10px;font-size:13px;font-weight:500;opacity:.8;text-align:center}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:10px;font-size:13px}
.hrow span{flex:1}
.heart{width:26px;height:26px;display:grid;place-items:center;transition:transform .2s}
.heart svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8}
.heart.on svg{fill:#ff8fb0;stroke:#ff8fb0}
.heart.pop{transform:scale(1.35)}
.masonry{position:absolute;top:110px;left:16px;right:16px;bottom:110px;overflow:auto;columns:2;column-gap:10px;scrollbar-width:none}
.masonry img{width:100%;display:block;border-radius:14px;margin-bottom:10px;break-inside:avoid;cursor:pointer;animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.upload{position:absolute;bottom:34px;left:50%;translate:-50% 0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.upload svg{width:28px;height:28px}
.big{position:absolute;top:110px;left:22px;right:22px;height:470px;border-radius:24px;overflow:hidden;background:#000}
.big img,.big canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .3s,transform .4s}
.big .cap{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:24px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.5);outline:0}
.tools{position:absolute;top:600px;left:30px;right:30px;display:flex;justify-content:space-between}
.tools button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;opacity:.75}
.tools button.on{opacity:1}
.tools i{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
.tools button.on i{background:#fff;color:#4a3f86}
.tools svg{width:20px;height:20px}
.save{position:absolute;left:60px;right:60px;bottom:52px;height:44px}

/* chat */
.chat .feed{position:absolute;top:110px;left:0;right:0;bottom:96px;overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.msg{display:flex;align-items:flex-end;gap:8px;max-width:84%;animation:pop .3s ease}
.msg img{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none}
.msg p{margin:0;padding:10px 13px;border-radius:18px 18px 18px 4px;font-size:14px;line-height:1.4;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.18)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me p{border-radius:18px 18px 4px 18px;background:linear-gradient(135deg,#8177e0,#c38be8)}
.msg .vm{display:flex;align-items:center;gap:8px;min-width:120px}
.msg .vm svg{width:16px;height:16px}
.typing{display:flex;gap:4px;padding:12px 14px}.typing i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.5;animation:wave 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

function mountAuth(el){
  const f=el.querySelector('form'), err=el.querySelector('.err'), box=el.querySelector('.box');
  el.querySelector('.agree').onclick=()=>box.classList.toggle('on');
  f.onsubmit=async e=>{e.preventDefault();
    const ins=[...f.querySelectorAll('input')];
    if(ins.every(i=>!i.value)){ // empty: type a demo account in, so a visitor can just tap through
      for(const i of ins){i.focus();for(const c of DEMO[i.name]){i.value+=c;await sleep(45)}}
      box.classList.add('on');await sleep(250);
    }
    const v=Object.fromEntries(ins.map(i=>[i.name,i.value.trim()]));
    let msg='';
    if(ins.some(i=>!i.value.trim()))msg='Fill in every field.';
    else if(!/\S+@\S+\.\S+/.test(v.email))msg='That email doesn’t look right.';
    else if(v.pw2!==undefined&&v.pw!==v.pw2)msg='The passwords don’t match.';
    else if(!box.classList.contains('on'))msg='Please agree to the terms first.';
    err.textContent=msg;
    if(msg){f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');return}
    const b=f.querySelector('.cta');b.classList.add('load');b.textContent=f.querySelector('[name=user]')?'Creating your space…':'Signing in…';
    await sleep(900);go('link');
  };
}

V.argue={bg:'argue',html:()=>`<iframe src="assets/lovelink-proto/argue.html" title="Argue mode"></iframe>`};

V.phono={bg:'dark',hint:'.pp',html:()=>`${SB()}${TOP('Phonograph','','home')}
  <div class="arm"></div><div class="vinyl"><img src="${A}rick.webp" alt=""></div>
  <div class="track glass"><img src="${A}rick.webp" alt=""><div style="flex:1"><b>Good night, my love</b><small>From Rick, 9:12 PM New York</small><div class="prog"><i></i></div></div><span data-pt style="font-size:11px;opacity:.7">0:00</span></div>
  <div class="ctrl"><button data-act="replay" aria-label="Replay">${I.replay}</button><button class="pp" aria-label="Play">${I.play}</button><button data-act="like" aria-label="Like">${I.heartL}</button></div>
  <button class="leave">Hold to leave a message</button>
  ${TAB('home')}${HB}`,
  mount(el){const v=el.querySelector('.vinyl'),arm=el.querySelector('.arm'),pp=el.querySelector('.pp'),bar=el.querySelector('.prog i'),pt=el.querySelector('[data-pt]');let on=false,pos=0,iv;
    const set=o=>{on=o;v.classList.toggle('on',o);arm.classList.toggle('on',o);pp.innerHTML=o?I.pause:I.play;clearInterval(iv);
      if(o)iv=setInterval(()=>{pos=Math.min(42,pos+.25);bar.style.width=pos/42*100+'%';pt.textContent='0:'+String(Math.floor(pos)).padStart(2,'0');if(pos>=42)set(false)},250)};
    pp.onclick=()=>set(!on);el.querySelector('[data-act=replay]').onclick=()=>{pos=0;set(true)};
    el.querySelector('[data-act=like]').onclick=e=>{e.currentTarget.classList.toggle('liked');toast('Rick will see you loved it')};
    const L=el.querySelector('.leave');let t0;
    L.onpointerdown=e=>{L.setPointerCapture(e.pointerId);t0=Date.now();L.classList.add('rec');L.lastChild.textContent='Recording… let go to send'};
    L.onpointerup=L.onpointercancel=()=>{if(!t0)return;L.classList.remove('rec');L.lastChild.textContent='Hold to leave a message';t0=0;toast('Left on Rick’s phonograph')};
    L.textContent='';L.append(document.createTextNode('Hold to leave a message'));
    el._cleanup=()=>clearInterval(iv)}};

/* room + credits */
const creditBar=()=>`<div class="credits"><span>Credits</span><div class="meter"><i style="width:${Math.min(100,S.credits/5)}%"></i></div><b data-cr>${S.credits}/500</b></div>`;
V.room={bg:'dark',hint:'[data-go=tasks]',html:()=>`${SB()}${TOP('Our room','Decorated together','home')}
  ${creditBar()}
  <div class="roomimg"><img src="${A}bedroom.webp" alt="Your shared bedroom, decorated together"></div>
  <p class="swipe">Swipe left to the kitchen</p>
  <div class="grid4"><button class="glass" data-go="design">Design room<small>Walls, floor, bed</small></button>
    <button class="glass" data-go="tasks">Tasks<small>${tasksDone()}/6 done today</small></button>
    <button class="glass" data-go="store">Store<small>Spend credits</small></button>
    <button class="glass" data-go="fridge">Kitchen<small>Our fridge</small></button></div>
  ${TAB('room')}${HB}`,
  mount(el){const r=el.querySelector('.roomimg');let x0=null;r.onpointerdown=e=>x0=e.clientX;r.onpointerup=e=>{if(x0!=null&&e.clientX-x0<-40)go('fridge');x0=null}}};

const WALLS=['#bfe3ff','#f5c8e4','#5b5ba8','#fde8a8'], FLOORS=['#f3b9a3','#ffd9c2','#e8cfa0'];
V.design={bg:'dark design',hint:'.done-btn',html:()=>`${SB()}${TOP('Design Room','','room','<span class="live" style="position:absolute;right:18px;top:12px">Rick is editing</span>')}
  <div class="roomimg"><img src="${A}bedroom.webp" alt="Room preview"><div class="wash" style="background:${WALLS[S.wall]}"></div></div>
  <div class="opt glass" style="top:372px"><header><b>Wall color</b><span>1/3</span></header><div class="sw" data-k="wall">${WALLS.map((c,i)=>`<button style="background:${c}" class="${S.wall===i?'on':''}" data-i="${i}" aria-label="Wall ${i+1}"></button>`).join('')}</div></div>
  <div class="opt glass" style="top:470px"><header><b>Floor type</b><span>2/3</span></header><div class="sw" data-k="floor">${FLOORS.map((c,i)=>`<button style="background:repeating-linear-gradient(90deg,${c} 0 8px,#fff8 8px 10px)" class="${S.floor===i?'on':''}" data-i="${i}" aria-label="Floor ${i+1}"></button>`).join('')}</div></div>
  <div class="opt glass" style="top:568px"><header><b>Bed type</b><span>3/3</span></header><div class="sw beds" data-k="bed">${['','hue-rotate(160deg) saturate(.6)','grayscale(1) brightness(1.1)'].map((f,i)=>`<button class="${S.bed===i?'on':''}" data-i="${i}" aria-label="Bed ${i+1}"><img src="${A}bed.webp" alt="" style="filter:${f}"></button>`).join('')}</div></div>
  <button class="done-btn grad-btn" data-act="done">Complete together</button>${HB}`,
  mount(el){el.querySelectorAll('.sw').forEach(sw=>sw.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;S[sw.dataset.k]=+b.dataset.i;
      sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));if(sw.dataset.k==='wall')el.querySelector('.wash').style.background=WALLS[S.wall]});
    el.querySelector('[data-act=done]').onclick=()=>{go('room');toast('Saved. Rick sees the new room too')}}};

V.tasks={bg:'dark',hint:'.task:not(.on)',html:()=>`${SB()}${TOP('Tasks','Credits for the room','room','<button class="pill" style="position:absolute;right:18px;top:8px" data-go="store">Store ›</button>')}
  <div class="duo glass"><img src="${A}helen.webp" alt="Helen"><div class="meter"><i style="width:${tasksDone()/12*100}%"></i><i style="width:${4/12*100}%"></i></div><img src="${A}rick.webp" alt="Rick"></div>
  <div class="nudge glass"><img src="${A}bear.webp" alt=""><div><b>Remember to punch in!</b>One more task and the surprise box opens today.</div></div>
  <div class="tasks-list">${S.tasks.map((t,i)=>`<button class="task glass${t[1]?' on':''}" data-t="${i}"><span>${t[0]}</span><span style="display:flex;align-items:center"><em>+5</em><i></i></span></button>`).join('')}</div>
  ${TAB('room')}${HB}`,
  mount(el){el.querySelector('.tasks-list').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const t=S.tasks[b.dataset.t];if(t[1])return toast('Already done today');
    t[1]=1;S.credits+=5;b.classList.add('on');el.querySelector('.duo .meter i').style.width=tasksDone()/12*100+'%';
    const r=b.getBoundingClientRect(),a=el.getBoundingClientRect(),k=a.width/393;
    el.insertAdjacentHTML('beforeend',`<span class="plus" style="left:${(r.right-a.left)/k-70}px;top:${(r.top-a.top)/k}px">+5</span>`);
    placeHint();
    if(tasksDone()===3&&!S.magnet){S.magnet=true;setTimeout(()=>el.insertAdjacentHTML('beforeend',`<div class="modal"><div class="m"><h3>Congratulations!</h3><img src="${A}bear.webp" alt="Bear magnet"><p>You got a new magnet! It’s on your fridge now.</p><button class="grad-btn" data-go="fridge">See it on the fridge</button></div></div>`),500)}}}};

const ITEMS={Furniture:[['bed','Bed',100],['settee','Cloud sofa',120],['office-chair','Desk chair',75],['pink-chair','Pink chair',90],['fluffy-chair','Shell chair',100],['pink-sofa','Pink sofa',120],['white-chair','Wicker chair',80]],Decor:[],Lights:[],Wallpaper:[]};
let storeTab='Furniture';
V.store={bg:'dark',hint:'.buy:not(.owned)',html:()=>`${SB()}${TOP('Store','','room','<span class="pill" style="position:absolute;right:18px;top:8px">♥ <span data-cr>'+S.credits+'</span></span>')}
  <div class="mystery"><div><b>Mystery Box</b><small>Finish 3 tasks together to unlock</small><div class="prog"><i style="width:${Math.min(3,tasksDone())/3*100}%"></i></div></div><button data-act="box" ${tasksDone()<3?'disabled':''}>${tasksDone()<3?tasksDone()+'/3':'Open'}</button></div>
  <div class="tabs">${Object.keys(ITEMS).map(k=>`<button class="${k===storeTab?'on':''}">${k}</button>`).join('')}</div>
  <div class="items">${ITEMS[storeTab].length?ITEMS[storeTab].map(([f,n,p])=>`<div class="item glass"><div class="pic"><img src="${A}${f}.webp" alt="${n}"></div><footer><span><b>${n}</b><small>♥ ${p}</small></span><button class="buy${S.owned.has(f)?' owned':''}" data-buy="${f}" data-p="${p}" aria-label="Buy ${n}">${S.owned.has(f)?'✓':'+'}</button></footer></div>`).join(''):'<p class="empty">New drops every Monday.</p>'}</div>
  ${TAB('room')}${HB}`,
  mount(el){el.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;storeTab=b.textContent;go('store',{same:1})};
    el.querySelector('.items').onclick=e=>{const b=e.target.closest('[data-buy]');if(!b||b.classList.contains('owned'))return;const p=+b.dataset.p;
      if(S.credits<p)return toast('Not enough credits yet. Finish a task!');S.credits-=p;S.owned.add(b.dataset.buy);b.classList.add('owned');b.textContent='✓';el.querySelector('[data-cr]').textContent=S.credits;toast('Added to your room');placeHint()};
    el.querySelector('[data-act=box]').onclick=()=>{const left=ITEMS.Furniture.filter(i=>!S.owned.has(i[0]));if(!left.length)return toast('You own everything!');
      const w=left[Math.floor(Math.random()*left.length)];S.owned.add(w[0]);
      el.insertAdjacentHTML('beforeend',`<div class="modal" data-close><div class="m"><h3>Surprise!</h3><img src="${A}${w[0]}.webp" alt="" style="height:130px"><p>You both got a <b>${w[1]}</b> for the room.</p><button class="grad-btn" data-close>Lovely</button></div></div>`)}}};

const MAGS=()=>[
  ['pol',{left:60,top:40,rotate:-6},`<img src="${A}helen.webp" alt="Helen">`,'helen'],
  ['pol',{left:180,top:70,rotate:5},`<img src="${A}rick.webp" alt="Rick">`,'rick'],
  ['ticket',{left:40,top:220,rotate:-3},'CINEMA<br>ADMIT ONE<span>NO. 0214</span>'],
  ['note',{left:180,top:230,rotate:4},'Recipe 🍳<br>Salmon &amp; asparagus, the bistro one. Try it together on FaceTime!'],
  ['pol',{left:70,top:340,rotate:3},`<img src="${A}photo-dome.webp" alt="">`,'photo-dome'],
  ['dot',{left:240,top:40,background:'#ff95c3'},''],['dot',{left:40,top:180,background:'#8177e0'},''],
  ...(S.magnet?[['bear',{left:190,top:380,rotate:-8},`<img src="${A}bear.webp" alt="Bear magnet">`]]:[])];
V.fridge={bg:'dark',hint:'.mag.pol',html:()=>`${SB()}${TOP('Kitchen','Our fridge','room')}
  <div class="fridge-door">${MAGS().map(([k,st,h,ph],i)=>`<div class="mag ${k}" data-i="${i}" ${ph?`data-photo="${ph}"`:''} style="left:${st.left}px;top:${st.top}px;rotate:${st.rotate||0}deg;${st.background?'background:'+st.background:''}">${h}</div>`).join('')}</div>
  <p class="fridge-hint">Double-tap a photo for the album. Press and hold to rearrange.</p>${HB}`,
  mount(el){const door=el.querySelector('.fridge-door');let hold,drag,ox,oy,last=0;
    door.onpointerdown=e=>{const m=e.target.closest('.mag');if(!m)return;
      if(door.classList.contains('edit')){drag=m;m.setPointerCapture(e.pointerId);ox=e.clientX;oy=e.clientY;return}
      hold=setTimeout(()=>{door.classList.add('edit');toast('Drag to rearrange, tap outside to finish')},550)};
    door.onpointermove=e=>{if(!drag)return;const k=door.getBoundingClientRect().width/325;drag.style.left=parseFloat(drag.style.left)+(e.clientX-ox)/k+'px';drag.style.top=parseFloat(drag.style.top)+(e.clientY-oy)/k+'px';ox=e.clientX;oy=e.clientY};
    door.onpointerup=e=>{clearTimeout(hold);drag=null;const m=e.target.closest('[data-photo]');if(!m||door.classList.contains('edit'))return;
      const now=Date.now();if(now-last<350){S.photo=m.dataset.photo;go('album')}last=now};
    el.onclick=e=>{if(door.classList.contains('edit')&&!e.target.closest('.fridge-door'))door.classList.remove('edit')}}};

/* ============ router ============ */
const app=document.getElementById('app'), qs=new URLSearchParams(location.search);
let cur=null, hintOn=!qs.has('nohint'), clockT;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ORDER=Object.keys(V);
function go(id,o={}){
  if(id==='test'||id==='me')return toast(id==='test'?'Couple tests arrive in the next update':'Profile arrives in the next update');
  if(!V[id])return;
  const old=app.querySelector('.scr:not(.out)');
  if(old){old._cleanup?.();if(o.same)old.remove();else{old.classList.add('out');setTimeout(()=>old.remove(),300)}}
  const back=!o.same&&cur&&ORDER.indexOf(id)<ORDER.indexOf(cur);
  const el=document.createElement('section');el.className=`scr ${V[id].bg}${o.same?'':' in'}${back?' back':''}`;el.innerHTML=V[id].html();
  app.append(el);cur=id;V[id].mount?.(el);setTimeout(placeHint,o.same?0:400);
  document.querySelectorAll('#rail [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===id));
  if(parent!==window)parent.postMessage({screen:id},location.origin);
}
app.addEventListener('click',e=>{
  const c=e.target.closest('[data-close]');if(c&&(e.target===c||c.tagName==='BUTTON')){c.closest('.modal').remove();return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go)}
});
function toast(t){let el=app.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';app.append(el)}
  el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1800)}
function placeHint(sel){app.querySelector('.tap')?.remove();if(!hintOn||!cur)return;const s=V[cur],scr=app.querySelector('.scr:not(.out)');let p=null;
  if(!sel&&s.tap)p=s.tap.map((v,i)=>v/100*(i?852:393));
  else{const t=scr?.querySelector(sel||s.hint);if(!t)return;const a=app.getBoundingClientRect(),r=t.getBoundingClientRect(),k=a.width/393;if(!r.width)return;p=[(r.left+r.width/2-a.left)/k,(r.top+r.height/2-a.top)/k]}
  if(!p)return;app.insertAdjacentHTML('beforeend',`<i class="tap" style="left:${p[0]}px;top:${p[1]}px"></i>`)}
// live clocks: New York on Home, both cities on the clock screen
function tick(el){clearTimeout(clockT);const now=new Date(),z=S.city==='lon'?'Europe/London':'America/New_York';
  const fmt=(tz,o)=>new Intl.DateTimeFormat('en-US',{timeZone:tz,...o}).format(now);
  el.querySelectorAll('[data-ny]').forEach(n=>n.textContent=fmt('America/New_York',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}));
  const dg=el.querySelector('[data-dig]');if(dg){const [h,m,s]=fmt(z,{hour:'numeric',minute:'numeric',second:'numeric',hourCycle:'h23'}).split(':').map(Number);
    dg.textContent=fmt(z,{hour:'numeric',minute:'2-digit'});el.querySelector('[data-place]').textContent=S.city==='lon'?'London, where Rick’s flight lands':'New York, where Rick is';
    el.querySelector('[data-w]').textContent=S.city==='lon'?'☁️ 55°F':'☀️ 83°F';
    el.querySelector('.hh').style.rotate=((h%12)*30+m/2)+'deg';el.querySelector('.mm').style.rotate=(m*6)+'deg';el.querySelector('.ss').style.rotate=(s*6)+'deg'}
  clockT=setTimeout(()=>{if(el.isConnected)tick(el)},1000)}

/* ============ rail, fit, messages ============ */
const GROUPS={Start:['welcome','signup','signin','link'],Home:['home','clock','calendar','history','album','photo','phono'],Chat:['chat','voice','ai','argue'],Room:['room','design','tasks','store','fridge']};
const NAMES={welcome:'Welcome',signup:'Sign up',signin:'Sign in',link:'Link your love',home:'Home',clock:'Time zones',calendar:'Calendar',history:'Chat history',album:'Album',photo:'Edit a photo',phono:'Phonograph',
  chat:'Chat and SOS',voice:'Voice message',ai:'AI friend',argue:'Argue mode',room:'Our room',design:'Design room',tasks:'Tasks and credits',store:'Store',fridge:'Fridge'};
const rail=document.getElementById('rail');
for(const [g,ids] of Object.entries(GROUPS)){rail.insertAdjacentHTML('beforeend',`<span>${g.toUpperCase()}</span>`);ids.forEach(id=>rail.insertAdjacentHTML('beforeend',`<button data-go="${id}">${NAMES[id]}</button>`))}
rail.insertAdjacentHTML('beforeend','<a href="lovelink.html">← Case study</a>');
rail.onclick=e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)};
function fit(){const emb=document.documentElement.classList.contains('embed');
  const h=(emb?innerHeight:Math.min(880,innerHeight-48))-20, w=(emb?innerWidth:Math.min(420,innerWidth-32))-20;
  const W=Math.floor(Math.min(w,h*393/852));document.querySelector('.phone').style.setProperty('--w',W+'px');
  app.style.transform=`scale(${W/393})`;placeHint()}
fit();addEventListener('resize',fit);
addEventListener('message',e=>{if(e.origin!==location.origin||!e.data)return;
  if(e.data.go)go(e.data.go);if(e.data.jump&&e.data.jump!==cur)go(e.data.jump);if('hint' in e.data){hintOn=!!e.data.hint;placeHint()}});
go(V[location.hash.slice(1)]?location.hash.slice(1):'welcome');
</script>
